name: Arhivă date de piață

# În fiecare seară păstrează într-o ramură proprie (`date-piete`) prețurile zilnice ale celor
# 13 piețe ale consiliului (indici, metale, petrol, forex, obligațiuni, 5 monede crypto), ca
# fișiere CSV, plus ultimele cursuri (EUR/USD, EUR/RON). Așa rămân datele cu care au decis
# conturile, chiar dacă sursa gratuită le schimbă sau le șterge. Doar citire de prețuri publice;
# nu tranzacționează și nu cheamă AI.

on:
  schedule:
    - cron: '45 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bnd-arhiva
  cancel-in-progress: false

jobs:
  colecteaza:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BND_ALLOW_LIVE_AI: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Restore the archive built so far
        run: bash scripts/restore_branch.sh date-piete arhiva
      - name: Download and add the new days
        run: |
          python -m src.bnd.backtest_cli fetch-universe --universe ai --update \
            --start "$(date -u -d '-3 years' +%Y-%m-%d)" --out-dir arhiva/zilnic
          python -m src.bnd.quotes_snapshot --out arhiva/ultimele-cursuri.json
          # Fear & Greed și funding: best effort, un eșec nu oprește arhiva.
          python -m src.bnd.context_data --out arhiva || true
          # Calendar economic (săptămâna asta și următoarea): doar arhivă, nu intră în decizii.
          python -m src.bnd.calendar_data --out arhiva || true
          # Top 50 cripto (inclusiv memecoin-uri), prețuri zilnice Binance: best effort.
          python -m src.bnd.crypto50 --out arhiva/crypto50 || true
          date -u +%Y-%m-%dT%H:%MZ > arhiva/ultima-actualizare.txt
          find arhiva/zilnic -name "*.csv" | wc -l >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bnd-arhiva-${{ github.run_id }}
          path: arhiva/
          retention-days: 3

  # Separate job: the write token never runs project code.
  publica:
    needs: colecteaza
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bnd-arhiva-${{ github.run_id }}
          path: arhiva
      - name: Save the archive on the date-piete branch
        run: |
          set -euo pipefail
          git init -q a && cd a
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          pushed=0
          for attempt in 1 2 3; do
            if git fetch -q --depth=1 origin date-piete 2>/dev/null; then
              git checkout -q -f -B date-piete FETCH_HEAD
            else
              git checkout -q --orphan date-piete 2>/dev/null || true
            fi
            rm -rf zilnic sentiment funding crypto50 calendar calendar-status.json context-status.json ultimele-cursuri.json ultima-actualizare.txt
            cp -r ../arhiva/zilnic ../arhiva/ultimele-cursuri.json ../arhiva/ultima-actualizare.txt .
            for extra in sentiment funding crypto50 calendar calendar-status.json context-status.json; do [ -e "../arhiva/$extra" ] && cp -r "../arhiva/$extra" . || true; done
            git add -A
            git commit -q -m "Date $(date -u +%Y-%m-%d)" || true
            if git push -q origin HEAD:refs/heads/date-piete; then pushed=1; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::Nu am putut salva pe ramură după 3 încercări."; exit 1; }

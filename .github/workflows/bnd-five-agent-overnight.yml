name: BND Five-Agent Overnight Council

on:
  push:
    branches: [main]
    paths:
      - 'scripts/overnight_five_agent_council.py'
      - 'tests/test_five_agent_council.py'
      - '.github/workflows/bnd-five-agent-overnight.yml'
  workflow_dispatch:
    inputs:
      paid_test_confirmation:
        description: 'Type RUN-PAID-TEST to authorize one manual OpenRouter test (local cap, not provider guarantee)'
        required: true
        type: string
        default: 'NO'
  schedule:
    - cron: "20 20 * * *"

permissions:
  contents: read

concurrency:
  group: bnd-paid-ai
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Paid calls ONLY for explicit manual dispatch with exact confirmation.
      # Push and schedule ALWAYS remain disabled.
      # Owner approved up to 1 USD per round. The prompt is the project's
      # source (about 15,000-17,000 tokens). Per call at that size: GPT-6
      # Astra about 0.20 USD, Claude Opus 5.5 about 0.08, the others 0.03-0.04;
      # the round about 0.37 USD. Caps: 0.30 per call, 0.80 per run (the run
      # stops before a call that could pass it). A repository variable
      # BND_MODEL_<AGENT> overrides the model.
      BND_MAX_RUN_COST_USD: "0.80"
      BND_MAX_CALL_COST_USD: "0.30"
      BND_MODEL_GPT: ${{ vars.BND_MODEL_GPT || 'openai/gpt-6-astra' }}
      BND_MODEL_CLAUDE: ${{ vars.BND_MODEL_CLAUDE || 'anthropic/claude-opus-5.5' }}
      BND_MODEL_GEMINI: ${{ vars.BND_MODEL_GEMINI || 'google/gemini-4-argon' }}
      BND_MODEL_GROK: ${{ vars.BND_MODEL_GROK || 'x-ai/grok-4.7' }}
      BND_MODEL_DEEPSEEK: ${{ vars.BND_MODEL_DEEPSEEK || 'deepseek/deepseek-v4-pro' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Offline safety tests (no paid calls)
        env:
          BND_ALLOW_PAID_AI: 'false'
          OPENROUTER_API_KEY: ''
        run: python -m unittest discover -s tests -p 'test_five_agent_council.py' -v
      - name: Generate independent agent proposals (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.paid_test_confirmation == 'RUN-PAID-TEST'
        timeout-minutes: 5
        env:
          BND_ALLOW_PAID_AI: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/overnight_five_agent_council.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bnd-five-agent-review-${{ github.run_id }}
          path: overnight-reports/five-agent-review.json
          if-no-files-found: warn
          retention-days: 7

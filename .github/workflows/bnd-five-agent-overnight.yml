name: Audit AI 5 agenți (plătit)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/overnight_five_agent_council.py'
      - 'tests/test_five_agent_council.py'
      - '.github/workflows/bnd-five-agent-overnight.yml'
  workflow_dispatch:
    inputs:
      paid_test_confirmation:
        description: 'Scrie exact RUN-PAID-TEST ca să pornești un test plătit (șterge NO)'
        required: true
        type: string
        default: 'NO'
      agents:
        description: 'Opțional: doar acești agenți, cu virgulă (deepseek,gpt,claude,gemini,grok). Gol = toți cinci'
        default: ''
        type: string
      files:
        description: 'Opțional: fișiere de auditat, ex. src/bnd/paper_engine.py (un fișier se citește întreg). Gol = toate, pe scurt'
        default: ''
        type: string
  schedule:
    - cron: "20 20 * * *"

permissions:
  contents: read

concurrency:
  group: bnd-paid-ai
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      # Paid calls ONLY for explicit manual dispatch with exact confirmation.
      # Push and schedule ALWAYS remain disabled.
      # Owner approved up to 1 USD per round. The prompt is the project's
      # source (about 15,000-17,000 tokens). Per call at that size: GPT-6
      # Astra about 0.20 USD, Claude Opus 5.5 about 0.08, the others 0.03-0.04;
      # the round about 0.37 USD. Caps: 0.40 per call, 0.90 per run (the run
      # stops before a call that could pass it). A repository variable
      # BND_MODEL_<AGENT> overrides the model.
      BND_MAX_RUN_COST_USD: "0.90"
      BND_MAX_CALL_COST_USD: "0.40"
      BND_MODEL_GPT: ${{ vars.BND_MODEL_GPT || 'openai/gpt-6-astra' }}
      BND_MODEL_CLAUDE: ${{ vars.BND_MODEL_CLAUDE || 'anthropic/claude-opus-5.5' }}
      BND_MODEL_GEMINI: ${{ vars.BND_MODEL_GEMINI || 'google/gemini-4-argon' }}
      BND_MODEL_GROK: ${{ vars.BND_MODEL_GROK || 'x-ai/grok-4.7' }}
      BND_MODEL_DEEPSEEK: ${{ vars.BND_MODEL_DEEPSEEK || 'deepseek/deepseek-v4-pro' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Offline safety tests (no paid calls)
        env:
          BND_ALLOW_PAID_AI: 'false'
          OPENROUTER_API_KEY: ''
        run: python -m unittest discover -s tests -p 'test_five_agent_council.py' -v
      - name: Generate independent agent proposals (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.paid_test_confirmation == 'RUN-PAID-TEST'
        timeout-minutes: 14
        env:
          # The script itself stops starting new calls after 10 minutes.
          BND_DEADLINE_SECONDS: "600"
          BND_ALLOW_PAID_AI: 'true'
          BND_ONLY_AGENTS: ${{ inputs.agents }}
          BND_AUDIT_FILES: ${{ inputs.files }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/overnight_five_agent_council.py
      - name: Say clearly whether the paid step ran
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.paid_test_confirmation }}
          AGENTS_INPUT: ${{ inputs.agents }}
          FILES_INPUT: ${{ inputs.files }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$CONFIRMATION" = "RUN-PAID-TEST" ]; then
            {
              echo "Pasul plătit a fost pornit (confirmare corectă)."
              echo "Agenți cerși: \`${AGENTS_INPUT:-toți}\`; fișiere: \`${FILES_INPUT:-toate, bucăți scurte}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "**Pasul plătit NU a rulat și nu s-a cheltuit nimic.**"
              echo "Pentru a-l porni: Run workflow, iar la paid_test_confirmation scrie exact RUN-PAID-TEST (litere mari, fără spații)."
              echo "Textul primit: \`${CONFIRMATION}\` (eveniment: ${EVENT})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bnd-five-agent-review-${{ github.run_id }}
          path: overnight-reports/five-agent-review.json
          if-no-files-found: warn
          retention-days: 7

  # Separate job: the write token never runs project code. It copies the
  # finished report to the backtest-results branch, only after a paid run.
  publish:
    needs: council
    if: always() && github.event_name == 'workflow_dispatch' && inputs.paid_test_confirmation == 'RUN-PAID-TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: bnd-five-agent-review-${{ github.run_id }}
          path: report
      - name: Commit the report to the backtest-results branch
        run: |
          set -euo pipefail
          if [ ! -f report/five-agent-review.json ]; then
            echo "::warning::No report to publish"; exit 0
          fi
          git init -q results
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            git fetch -q --depth=1 origin backtest-results
            git checkout -q -f -B backtest-results FETCH_HEAD
            mkdir -p ai-rounds
            cp ../report/five-agent-review.json "ai-rounds/${RUN_ID}.json"
            git add -A
            git commit -q -m "Raport rundă AI cu 5 agenți, rularea ${RUN_ID}"
            if git push -q origin HEAD:refs/heads/backtest-results; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Nu am putut salva raportul"
          exit 1

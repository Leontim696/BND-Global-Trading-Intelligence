name: Review AI GPT+Claude (plătit)
on:
  workflow_dispatch:
  schedule:
    - cron: "50 21 * * *"
permissions:
  contents: read
concurrency:
  group: bnd-paid-ai
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Flags read by the code; live and paid AI stay off.
      BND_ALLOW_LIVE_AI: "false"
      # Paid calls stay off unless the repository variable is set to true.
      BND_ALLOW_PAID_AI: ${{ vars.BND_ALLOW_PAID_AI || 'false' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BND_DEV_MODEL: ${{ vars.BND_DEV_MODEL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Stop the schedule after the 16-day test
        id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # O programare uitată nu mai cheltuie după testul de 16 zile (16.11.2026); rularea manuală merge oricând.
          if [ "$EVENT" = schedule ] && [ "$(date -u +%Y-%m-%d)" \> "2026-11-16" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Programarea s-a încheiat (testul de 16 zile s-a terminat): nu se rulează." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate bounded AI review
        if: steps.window.outputs.run == 'true'
        run: python scripts/overnight_ai_review.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bnd-ai-review-${{ github.run_id }}
          path: overnight-reports/
          retention-days: 7

name: Review AI GPT+Claude (plătit)
# Plătit (GPT + Claude, cel mult 2 apeluri de max 1000 de tokeni). Doar manual și doar cu confirmarea exactă
# RUN-PAID-TEST, ca toate celelalte workflow-uri plătite; fără programare automată.
on:
  workflow_dispatch:
    inputs:
      paid_test_confirmation:
        description: 'Doar pentru apel plătit: scrie RUN-PAID-TEST (șterge NO)'
        default: 'NO'
        type: string
permissions:
  contents: read
concurrency:
  group: bnd-paid-ai
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Flags read by the code; live and paid AI stay off.
      BND_ALLOW_LIVE_AI: "false"
      # Paid calls stay off unless the repository variable is set to true.
      BND_ALLOW_PAID_AI: ${{ vars.BND_ALLOW_PAID_AI || 'false' }}
      BND_DEV_MODEL: ${{ vars.BND_DEV_MODEL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Check the paid-test confirmation
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.paid_test_confirmation }}
        run: python scripts/confirm_paid_test.py
      - name: Generate bounded AI review
        if: steps.gate.outputs.confirmed == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/overnight_ai_review.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bnd-ai-review-${{ github.run_id }}
          path: overnight-reports/
          retention-days: 7

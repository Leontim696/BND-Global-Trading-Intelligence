name: BND Overnight Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *" # 21:20 CET / 22:20 CEST (UTC); adjust for DST
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bnd-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run offline test suite
        env:
          BND_ALLOW_LIVE: "false"
        run: python -m pytest -q
      - name: Write run summary
        if: always()
        run: |
          echo "## BND overnight validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Offline tests only. No broker orders, live trading, or paid AI calls." >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

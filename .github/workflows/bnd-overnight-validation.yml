name: Validare nocturnă (gratis)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *" # 21:20 CET / 22:20 CEST (UTC); adjust for DST
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bnd-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Flags read by the code; live and paid AI stay off.
      BND_ALLOW_LIVE_AI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest -q
      - name: Write run summary
        if: always()
        run: |
          {
            echo "## BND overnight validation"
            echo "Offline tests only. No broker orders, live trading, or paid AI calls."
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

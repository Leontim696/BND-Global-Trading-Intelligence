name: Bot AI unificat (virtual)

# UN SINGUR cont virtual, condus de consiliul AI, pe toate piețele (indici,
# aur, argint, petrol, forex, obligațiuni, crypto). NU face apeluri plătite:
# după ce consiliul zilnic (consiliu-umbra.yml, 21:40 UTC) a votat, citește
# voturile din registru și le transformă în ordine virtuale (long/short,
# dimensionate după volatilitate, cu stop). Banii se duc acolo unde sunt
# semnale. Contul trăiește pe ramura ai-unificat. Nu pornește singur: se creează
# dintr-o rulare manuală cu capitalul virtual confirmat.

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      capital:
        description: 'Capital virtual în dolari, doar ca să CREEZI contul (gol = continuă)'
        default: ''
        type: string
      reset_kill_switch:
        description: 'Scrie RESET-KILL-SWITCH ca să repornești după o oprire de siguranță'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-ai-unificat
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      account: ${{ steps.restore.outputs.account }}
    env:
      BND_ALLOW_LIVE_AI: "false"
      BND_TRADING_MODE: PAPER
      CAPITAL: ${{ inputs.capital }}
      RESET: ${{ inputs.reset_kill_switch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore the account from the ai-unificat branch
        id: restore
        run: |
          mkdir -p state data
          if git fetch -q --depth=1 origin ai-unificat 2>/dev/null \
              && git cat-file -e FETCH_HEAD:paper.sqlite 2>/dev/null; then
            git show FETCH_HEAD:paper.sqlite > state/paper.sqlite
            git show FETCH_HEAD:audit.jsonl > state/audit.jsonl 2>/dev/null || true
            echo "account=existing" >> "$GITHUB_OUTPUT"
          elif [ -n "$CAPITAL" ]; then
            echo "account=new" >> "$GITHUB_OUTPUT"
          else
            echo "account=none" >> "$GITHUB_OUTPUT"
            echo "Încă nu există contul AI unificat. Pornește-l dintr-o rulare manuală cu capitalul virtual." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Take the council's votes
        if: steps.restore.outputs.account != 'none'
        run: |
          if git fetch -q --depth=1 origin consiliu-umbra 2>/dev/null \
              && git cat-file -e FETCH_HEAD:registry.sqlite 2>/dev/null; then
            git show FETCH_HEAD:registry.sqlite > state/registry.sqlite
          fi
          python -m src.bnd.crypto_signals --registry state/registry.sqlite \
            --coins SP500,NASDAQ100,GOLD,SILVER,CRUDE_OIL,BITCOIN,ETHEREUM,EURUSD,USDJPY,US10Y_NOTE,SOLANA,BNB,XRP \
            --out state/semnale.json
      - name: Download the candles
        if: steps.restore.outputs.account != 'none'
        run: |
          python -m src.bnd.backtest_cli fetch-universe --universe ai \
            --start "$(date -u -d '-2 years' +%Y-%m-%d)" --out-dir data
      - name: Daily AI step
        if: steps.restore.outputs.account != 'none'
        env:
          ACCOUNT: ${{ steps.restore.outputs.account }}
        run: |
          args=()
          if [ "$ACCOUNT" = new ]; then
            # Leverage maxim 2x, maxim 40% într-o piață și 60% într-o clasă (ex. crypto), finanțare 5%.
            args+=(--capital "$CAPITAL" --universe ai --strategy ai_council
                   --max-leverage 2 --max-weight 0.4 --max-sector 60 --portfolio-vol 15 --financing 5)
          fi
          if [ -n "$RESET" ]; then args+=(--reset-kill-switch "$RESET"); fi
          python -m src.bnd.paper_runner --state state/paper.sqlite --data-dir data \
            --signals state/semnale.json --audit-log state/audit.jsonl \
            --report state/REPORT.md --json state/last_run.json "${args[@]}" > /dev/null
          cat state/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.restore.outputs.account != 'none'
        with:
          name: bnd-ai-${{ github.run_id }}
          path: state/
          if-no-files-found: ignore
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: step
    if: always() && needs.step.outputs.account != 'none' && needs.step.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RESULT: ${{ needs.step.result }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: bnd-ai-${{ github.run_id }}
          path: state
      - name: Commit the account to the ai-unificat branch
        run: |
          set -euo pipefail
          if [ ! -f state/paper.sqlite ]; then echo "::warning::No account file"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          git init -q account
          cd account
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth=1 origin ai-unificat 2>/dev/null; then
              git checkout -q -f -B ai-unificat FETCH_HEAD
            else
              git checkout -q --orphan ai-unificat 2>/dev/null || true
            fi
            cp ../state/paper.sqlite .
            if [ -f ../state/audit.jsonl ]; then cp ../state/audit.jsonl .; fi
            mkdir -p runs
            if [ -f ../state/REPORT.md ]; then cp ../state/REPORT.md README.md; fi
            if [ -f ../state/semnale.json ]; then cp ../state/semnale.json "runs/${day}-semnale.json"; fi
            if [ -f ../state/last_run.json ]; then cp ../state/last_run.json "runs/$day.json"; fi
            git add -A
            git commit -q -m "Pas AI unificat $day, rularea $RUN_ID ($RESULT)" || true
            if git push -q origin HEAD:refs/heads/ai-unificat; then break; fi
            if [ "$attempt" = 4 ]; then echo "::error::Could not save the account"; exit 1; fi
            sleep $((attempt * 5))
          done

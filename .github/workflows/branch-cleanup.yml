name: Curățenie ramuri

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove every branch already fully merged into main'
        required: true
        type: string
      also_delete:
        description: 'Optional: extra branches to delete even if not merged, comma-separated (never main or a state branch: backtest-results, paper-trading, crypto-trading, ai-unificat, consiliu-umbra, status, date-piete, reguli-ls, cont-unic, cont-control, formatii-ai, intraday, smart-money, date-12-ani, date-macro)'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ALSO_DELETE: ${{ inputs.also_delete }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Delete branches whose commits are all in main
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0; kept=0
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            branch="${ref#origin/}"
            case "$branch" in
              # paper-trading holds the virtual account: never touched.
              main|backtest-results|paper-trading|crypto-trading|ai-unificat|consiliu-umbra|status|date-piete|reguli-ls|cont-unic|cont-control|formatii-ai|intraday|smart-money|date-12-ani|date-macro|HEAD|origin) continue ;;
            esac
            if git merge-base --is-ancestor "$ref" origin/main; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Deleted: $branch"; deleted=$((deleted + 1))
            else
              echo "Kept (not fully merged): $branch"; kept=$((kept + 1))
            fi
          done
          IFS=',' read -r -a extra <<< "$ALSO_DELETE"
          for branch in "${extra[@]}"; do
            branch="${branch//[[:space:]]/}"
            case "$branch" in
              ""|main|backtest-results|paper-trading|crypto-trading|ai-unificat|consiliu-umbra|status|date-piete|reguli-ls|cont-unic|cont-control|formatii-ai|intraday|smart-money|date-12-ani|date-macro) continue ;;
            esac
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" > /dev/null; then
                echo "Deleted (asked for): $branch"; deleted=$((deleted + 1))
              else
                echo "Could not delete (already gone?): $branch"
              fi
            else
              echo "Not found (already gone?): $branch"
            fi
          done
          {
            echo "## Branch cleanup"
            echo "Deleted $deleted branches; kept $kept with unmerged commits."
          } >> "$GITHUB_STEP_SUMMARY"

name: BND Branch Cleanup (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove every branch already fully merged into main'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bnd-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branches whose commits are all in main
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0; kept=0
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            branch="${ref#origin/}"
            case "$branch" in
              main|backtest-results|HEAD|origin) continue ;;
            esac
            if git merge-base --is-ancestor "$ref" origin/main; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Deleted: $branch"; deleted=$((deleted + 1))
            else
              echo "Kept (not fully merged): $branch"; kept=$((kept + 1))
            fi
          done
          {
            echo "## Branch cleanup"
            echo "Deleted $deleted fully merged branches; kept $kept with unmerged commits."
          } >> "$GITHUB_STEP_SUMMARY"

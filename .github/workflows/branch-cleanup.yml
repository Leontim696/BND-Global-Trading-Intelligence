name: BND Branch Cleanup (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove every branch listed in .github/branch-cleanup.txt'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bnd-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete listed branches (main is always kept)
        run: |
          deleted=0; missing=0
          while IFS= read -r branch; do
            branch="${branch%%#*}"; branch="$(echo "$branch" | xargs)"
            [ -z "$branch" ] && continue
            if [ "$branch" = "main" ]; then
              echo "::warning::Refusing to delete main"; continue
            fi
            if gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Deleted: $branch"; deleted=$((deleted + 1))
            else
              echo "Already gone: $branch"; missing=$((missing + 1))
            fi
          done < .github/branch-cleanup.txt
          echo "## Branch cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "Deleted $deleted, already gone $missing." >> "$GITHUB_STEP_SUMMARY"

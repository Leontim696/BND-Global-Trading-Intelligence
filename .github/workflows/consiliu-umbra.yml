name: Consiliul AI în umbră

# One council round a day on a few markets: the five agents vote independently,
# the votes are recorded, and after 5 days they are compared with what the
# market did, with the rule-based bot and with "always buy". Nothing is traded.
#
# Paid calls: a manual run needs mode=live and the exact words RUN-PAID-TEST;
# the daily schedule runs only while the repository variable BND_COUNCIL_DAILY
# is "on" (the owner switches it). mode=mock uses simulated agents: free.

on:
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'mock = agenți simulați (gratis); live = agenți reali (plătit, cere confirmarea)'
        default: 'mock'
        type: choice
        options: [mock, live]
      paid_test_confirmation:
        description: 'Doar pentru live: scrie RUN-PAID-TEST (șterge NO)'
        default: 'NO'
        type: string
      markets:
        description: 'Piețele, cu virgulă (litere mari)'
        default: 'SP500,NASDAQ100,GOLD,SILVER,CRUDE_OIL,BITCOIN,ETHEREUM,EURUSD,USDJPY,US10Y_NOTE,SOLANA,BNB,XRP,TRX,DOGE,ADA,LINK,AVAX,XLM,SUI,SHIB,BCH,LTC,DOT,HBAR,UNI,PEPE,AAVE,NEAR,ICP,ETC,APT,ONDO,ATOM,POL,ARB,FIL,ALGO,VET,OP,INJ,RENDER,TAO,FET,SEI,STX,BONK,WIF,FLOKI,TRUMP,PENGU,ENA,WLD,JUP,LDO,CRV,TIA,RHEINMETALL,HENSOLDT,RENK,BAE,THALES,LEONARDO,SAAB,KONGSBERG,LOCKHEED,NORTHROP,RTX,GENERAL_DYNAMICS,L3HARRIS,ITA,AAPL,MSFT,NVDA,GOOGL,AMZN,WMT,KO,PG,JNJ,UNH,XOM,CVX,JPM,GS,CAT,BA'
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-council
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run: ${{ steps.mode.outputs.run }}
      live: ${{ steps.mode.outputs.live }}
    env:
      EVENT: ${{ github.event_name }}
      MODE_INPUT: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.paid_test_confirmation }}
      DAILY_SWITCH: ${{ vars.BND_COUNCIL_DAILY }}
      MARKETS: ${{ inputs.markets || 'SP500,NASDAQ100,GOLD,SILVER,CRUDE_OIL,BITCOIN,ETHEREUM,EURUSD,USDJPY,US10Y_NOTE,SOLANA,BNB,XRP,TRX,DOGE,ADA,LINK,AVAX,XLM,SUI,SHIB,BCH,LTC,DOT,HBAR,UNI,PEPE,AAVE,NEAR,ICP,ETC,APT,ONDO,ATOM,POL,ARB,FIL,ALGO,VET,OP,INJ,RENDER,TAO,FET,SEI,STX,BONK,WIF,FLOKI,TRUMP,PENGU,ENA,WLD,JUP,LDO,CRV,TIA,RHEINMETALL,HENSOLDT,RENK,BAE,THALES,LEONARDO,SAAB,KONGSBERG,LOCKHEED,NORTHROP,RTX,GENERAL_DYNAMICS,L3HARRIS,ITA,AAPL,MSFT,NVDA,GOOGL,AMZN,WMT,KO,PG,JNJ,UNH,XOM,CVX,JPM,GS,CAT,BA' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Decide whether to run, and whether the agents are real
        id: mode
        run: |
          mkdir -p state data
          run=true; live=false
          if [ "$EVENT" = schedule ]; then
            # The 16-day test ends on 2026-11-16: a forgotten switch must not keep spending.
            if [ "$(date -u +%Y-%m-%d)" \> "2026-11-16" ]; then
              run=false
              echo "Testul de 16 zile s-a încheiat (16.11.2026): nu mai rulează nimic zilnic." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$DAILY_SWITCH" = on ]; then live=true; else run=false; fi
          elif [ "$MODE_INPUT" = live ]; then
            GITHUB_OUTPUT=gate.txt python scripts/confirm_paid_test.py > /dev/null
            if grep -q '^confirmed=true' gate.txt; then live=true; else run=false; fi
          fi
          {
            echo "run=$run"; echo "live=$live"
          } >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "Nu s-a rulat nimic și nu s-a cheltuit nimic: pentru live scrie exact RUN-PAID-TEST, iar rularea zilnică cere variabila BND_COUNCIL_DAILY = on." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore the registry and the costs
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.live == 'true'
        run: bash scripts/restore_branch.sh consiliu-umbra state "!registry.sqlite" "!costs.sqlite" "!audit.jsonl"
      - name: Restore yesterday's candles
        if: steps.mode.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: council-candles-${{ github.run_id }}
          restore-keys: council-candles-
      - name: Download the candles (only new days when cached)
        if: steps.mode.outputs.run == 'true'
        run: |
          # Trei surse: ETF/forex (Yahoo), monede crypto Yahoo (SOL, BNB, XRP), restul monedelor (Binance).
          # Numele sunt validate de crypto50 (doar litere mari, cifre, _) înainte să ajungă în comenzi.
          groups="$(python -m src.bnd.crypto50 --split "$MARKETS")"
          etf="$(echo "$groups" | sed -n 's/^etf=//p')"
          yahoo_crypto="$(echo "$groups" | sed -n 's/^yahoo_crypto=//p')"
          binance="$(echo "$groups" | sed -n 's/^binance=//p')"
          defense="$(echo "$groups" | sed -n 's/^defense=//p')"
          stocks="$(echo "$groups" | sed -n 's/^stocks=//p')"
          start="$(date -u -d '-2 years' +%Y-%m-%d)"
          python -m src.bnd.backtest_cli fetch-universe --universe etf --update \
            --markets "$etf" --start "$start" --out-dir data
          if [ -n "$yahoo_crypto" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe crypto --update \
              --markets "$yahoo_crypto" --start "$start" --out-dir data
          fi
          if [ -n "$binance" ]; then
            python -m src.bnd.crypto50 --out data --only "$binance"
          fi
          if [ -n "$defense" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe defense --update \
              --markets "$defense" --start "$start" --out-dir data
          fi
          if [ -n "$stocks" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe stocks --update \
              --markets "$stocks" --start "$start" --out-dir data
          fi
      - name: Keep the candles for tomorrow
        if: steps.mode.outputs.run == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: council-candles-${{ github.run_id }}
      - name: Simulated agents (free)
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.live != 'true'
        run: |
          python -m src.bnd.council_daily --mode mock --data-dir data --markets "$MARKETS" \
            --registry state/mock-registry.sqlite --report state/raport.md --json state/raport.json > /dev/null
          cat state/raport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Real agents (paid, capped)
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.live == 'true'
        env:
          BND_ALLOW_LIVE_AI: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Empty = the defaults in council_daily.py; a repository variable overrides.
          # Plafoane de cost: implicit 3,00 $/zi și 38 $/lună; se pot ridica din variabilele de depozit.
          DAILY_CAP: ${{ vars.BND_COUNCIL_DAILY_CAP }}
          MONTHLY_CAP: ${{ vars.BND_COUNCIL_MONTHLY_CAP }}
          BND_MODEL_GPT: ${{ vars.BND_MODEL_GPT }}
          BND_MODEL_CLAUDE: ${{ vars.BND_MODEL_CLAUDE }}
          BND_MODEL_GEMINI: ${{ vars.BND_MODEL_GEMINI }}
          BND_MODEL_GROK: ${{ vars.BND_MODEL_GROK }}
          BND_MODEL_DEEPSEEK: ${{ vars.BND_MODEL_DEEPSEEK }}
        run: |
          python -m src.bnd.council_daily --mode live --data-dir data --markets "$MARKETS" \
            --registry state/registry.sqlite --costs state/costs.sqlite \
            --round-budget 0.60 --daily-budget "${DAILY_CAP:-3.00}" --monthly-budget "${MONTHLY_CAP:-38}" \
            --audit-log state/audit.jsonl --report state/raport.md --report-short state/raport-scurt.md \
            --json state/raport.json > /dev/null
          cat state/raport.md >> "$GITHUB_STEP_SUMMARY"
          # Analiza agenților: doar citire din registru, fără apeluri AI.
          python -m src.bnd.council_analytics --registry state/registry.sqlite > state/analiza.json || echo "::warning::analiza agenților a eșuat"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.mode.outputs.run == 'true'
        with:
          name: bnd-council-${{ github.run_id }}
          path: state/
          if-no-files-found: ignore
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: council
    if: always() && needs.council.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      LIVE: ${{ needs.council.outputs.live }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: bnd-council-${{ github.run_id }}
          path: state
      - name: Save the state and the report on the consiliu-umbra branch
        run: |
          set -euo pipefail
          if [ ! -f state/raport.md ]; then echo "::warning::No report"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          git init -q out
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth=1 origin consiliu-umbra 2>/dev/null; then
              git checkout -q -f -B consiliu-umbra FETCH_HEAD
            else
              git checkout -q --orphan consiliu-umbra 2>/dev/null || true
            fi
            mkdir -p consiliu
            if [ "$LIVE" = true ]; then
              cp ../state/registry.sqlite ../state/costs.sqlite .
              if [ -f ../state/audit.jsonl ]; then cp ../state/audit.jsonl .; fi
              if [ -s ../state/analiza.json ]; then cp ../state/analiza.json consiliu/analiza.json; fi
              if [ -f ../state/raport.json ]; then cp ../state/raport.json consiliu/LATEST.json; fi
              cp ../state/raport.md "consiliu/${day}.md"
              cp ../state/raport.md consiliu/LATEST.md
              if [ -f ../state/raport-scurt.md ]; then
                cp ../state/raport-scurt.md "consiliu/${day}-scurt.md"
                cp ../state/raport-scurt.md consiliu/LATEST-scurt.md
              fi
            else
              cp ../state/raport.md consiliu/mock-LATEST.md
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Consiliul AI ${day}, rularea ${RUN_ID} (live=${LIVE})"
            else
              echo "Nimic nou de salvat."
            fi
            if git push -q origin HEAD:refs/heads/consiliu-umbra; then break; fi
            if [ "$attempt" = 4 ]; then echo "::error::Could not save"; exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Post the live report on today's reports issue
        if: env.LIVE == 'true'
        run: |
          set -euo pipefail
          [ -f state/raport.md ] || exit 0
          title="Rapoarte bot virtual $(date -u +%Y-%m-%d)"
          number=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            -q "[.[] | select(.title == \"$title\") | .number][0] // empty")
          if [ -z "$number" ]; then
            number=$(gh api -X POST "repos/$REPO/issues" -f title="$title" \
              -f body="Rapoartele orare ale botului virtual pentru ziua de azi (ora UTC)." -q .number)
          fi
          # Un comentariu GitHub are limita de 65.536 de caractere: se pune varianta scurtă, dacă există.
          source=state/raport.md
          if [ -f state/raport-scurt.md ]; then source=state/raport-scurt.md; fi
          head -c 60000 "$source" > state/comentariu.md
          gh api -X POST "repos/$REPO/issues/$number/comments" -F body=@state/comentariu.md > /dev/null

name: Cont de control (doar reguli, virtual)

# Cerut de proprietar pe 3.11.2026. Contul de CONTROL pentru testul oficial: identic cu contul unic
# (aceleași 101 piețe, aceleași limite: leverage 2x, 25% pe piață, 60% pe clasă, volatilitate-țintă 15%,
# finanțare 5%/an, același capital 11.183 USD, același program), DAR fără consiliul AI: doar regulile
# regime_switch, adică exact partea „reguli” din hibrid. Diferența dintre cele două conturi = ce aduce
# consiliul. Nu face apeluri AI și nu atinge contul unic (ramură separată: cont-control).
# Pornit pe 4.11.2026 (comparația acoperă zilele de după pornire).

on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      capital:
        description: 'Capital virtual în dolari, doar ca să CREEZI contul (gol = continuă)'
        default: ''
        type: string
      reset_kill_switch:
        description: 'Scrie RESET-KILL-SWITCH ca să repornești după o oprire de siguranță'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-cont-control
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      account: ${{ steps.restore.outputs.account }}
    env:
      BND_ALLOW_LIVE_AI: "false"
      BND_TRADING_MODE: PAPER
      CAPITAL: ${{ inputs.capital }}
      RESET: ${{ inputs.reset_kill_switch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Restore the account from the cont-control branch
        id: restore
        env:
          REQUIRE_AUDIT: "1"
        run: |
          bash scripts/restore_account.sh cont-control "Încă nu există contul de control. Pornește-l dintr-o rulare manuală cu capitalul 11183."
      - name: Download the candles (ETF/forex and Yahoo crypto, then Binance coins)
        if: steps.restore.outputs.account != 'none'
        run: |
          names="$(python -c "from src.bnd.universe import UNIVERSES; print(','.join(m.name for m in UNIVERSES['unic']))")"
          groups="$(python -m src.bnd.crypto50 --split "$names")"
          etf="$(echo "$groups" | sed -n 's/^etf=//p')"
          yahoo_crypto="$(echo "$groups" | sed -n 's/^yahoo_crypto=//p')"
          binance="$(echo "$groups" | sed -n 's/^binance=//p')"
          defense="$(echo "$groups" | sed -n 's/^defense=//p')"
          stocks="$(echo "$groups" | sed -n 's/^stocks=//p')"
          start="$(date -u -d '-3 years' +%Y-%m-%d)"
          python -m src.bnd.backtest_cli fetch-universe --universe etf --markets "$etf" --start "$start" --out-dir data
          if [ -n "$yahoo_crypto" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe crypto --markets "$yahoo_crypto" --start "$start" --out-dir data
          fi
          if [ -n "$binance" ]; then
            python -m src.bnd.crypto50 --out data --only "$binance"
          fi
          if [ -n "$defense" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe defense --markets "$defense" --start "$start" --out-dir data
          fi
          if [ -n "$stocks" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe stocks --markets "$stocks" --start "$start" --out-dir data
          fi
      - name: Keep the restored (last valid) state
        if: steps.restore.outputs.account == 'existing'
        run: |
          mkdir -p prev
          cp state/paper.sqlite state/audit.jsonl prev/
      - name: Daily step
        if: steps.restore.outputs.account != 'none'
        env:
          ACCOUNT: ${{ steps.restore.outputs.account }}
        run: |
          args=()
          if [ "$ACCOUNT" = new ]; then
            # Aceleași setări ca la contul unic; singura diferență: strategia (doar reguli, fără consiliu).
            args+=(--capital "$CAPITAL" --universe unic --strategy regime_switch
                   --max-leverage 2 --max-weight 0.25 --max-sector 60 --portfolio-vol 15 --financing 5)
          fi
          if [ -n "$RESET" ]; then args+=(--reset-kill-switch "$RESET"); fi
          python -m src.bnd.paper_runner --state state/paper.sqlite --data-dir data \
            --audit-log state/audit.jsonl \
            --report state/REPORT.md --json state/last_run.json "${args[@]}" > /dev/null
          cat state/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Correlated exposure report (read-only)
        if: steps.restore.outputs.account != 'none'
        run: python -m src.bnd.exposure --state state/paper.sqlite --data-dir data --out state/expuneri.json || echo "::warning::raportul de expuneri a eșuat"
      - name: Checkpoint (integrity of account and audit log)
        id: checkpoint
        if: steps.restore.outputs.account != 'none'
        env:
          ACCOUNT: ${{ steps.restore.outputs.account }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$ACCOUNT" = new ]; then flags=(--new); else flags=(--previous prev); fi
          python -m src.bnd.state_check --state state "${flags[@]}" --run-id "$RUN_ID"
      # Doar o stare care a trecut de punctul de control se publică.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && steps.restore.outputs.account != 'none'
        with:
          name: bnd-control-${{ github.run_id }}
          path: state/
          if-no-files-found: error
          retention-days: 14
      # La eșec: copie pentru diagnostic și ultima stare validă, NICIODATĂ consumate de publicare.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && steps.restore.outputs.account != 'none'
        with:
          name: bnd-control-ESEC-${{ github.run_id }}
          path: |
            state/
            prev/
          if-no-files-found: ignore
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: step
    if: needs.step.result == 'success' && needs.step.outputs.account != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RESULT: ${{ needs.step.result }}
    steps:
      # Checkout ÎNAINTE de descărcare: checkout curăță spațiul de lucru și ar șterge starea descărcată (rularea din 1.11 a
      # eșuat sigur pe asta: lipsea VALID.json și nu s-a publicat nimic).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify_marker.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bnd-control-${{ github.run_id }}
          path: state
      - name: Verify the checkpoint marker (hashes only, no project code)
        run: bash scripts/verify_marker.sh state
      - name: Commit the account to the cont-control branch
        run: |
          set -euo pipefail
          if [ ! -f state/paper.sqlite ]; then echo "::error::No account file"; exit 1; fi
          day=$(date -u +%Y-%m-%d)
          git init -q account
          cd account
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth=1 origin cont-control 2>/dev/null; then
              git checkout -q -f -B cont-control FETCH_HEAD
            else
              git checkout -q --orphan cont-control 2>/dev/null || true
            fi
            cp ../state/paper.sqlite .
            if [ -f ../state/audit.jsonl ]; then cp ../state/audit.jsonl .; fi
            mkdir -p runs
            if [ -f ../state/REPORT.md ]; then cp ../state/REPORT.md README.md; fi
            if [ -f ../state/expuneri.json ]; then cp ../state/expuneri.json expuneri.json; fi
            if [ -f ../state/last_run.json ]; then cp ../state/last_run.json "runs/$day.json"; fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Pas cont de control $day, rularea $RUN_ID ($RESULT)"
            else
              echo "Nimic nou de salvat."
            fi
            if git push -q origin HEAD:refs/heads/cont-control; then break; fi
            if [ "$attempt" = 4 ]; then echo "::error::Could not save the account"; exit 1; fi
            sleep $((attempt * 5))
          done

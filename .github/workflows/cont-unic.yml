name: Cont unic (virtual)

# UN SINGUR cont virtual, hibrid: pentru fiecare piață amestecă semnalul regulilor (regime_switch) cu
# semnalul consiliului AI (jumătate-jumătate; la acord poziția crește, la dezacord se anulează; fără
# vot AI azi, decid doar regulile). Poate face long și short, leverage până la 2x, finanțare 5%/an.
# Universul: piețele ETF/forex + SOL/BNB/XRP + 45 de monede din top 50 cripto (71 de piețe), cu
# memecoin-urile într-un sector separat. NU face apeluri plătite: citește voturile consiliului
# (consiliu-umbra.yml). Cont pe ramura cont-unic; nu pornește singur: se creează dintr-o rulare
# manuală cu capitalul virtual confirmat. Înlocuiește cele patru conturi vechi (oprite).

on:
  schedule:
    - cron: '25 22 * * *'
  workflow_dispatch:
    inputs:
      capital:
        description: 'Capital virtual în dolari, doar ca să CREEZI contul (gol = continuă)'
        default: ''
        type: string
      reset_kill_switch:
        description: 'Scrie RESET-KILL-SWITCH ca să repornești după o oprire de siguranță'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-cont-unic
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      account: ${{ steps.restore.outputs.account }}
    env:
      BND_ALLOW_LIVE_AI: "false"
      BND_TRADING_MODE: PAPER
      CAPITAL: ${{ inputs.capital }}
      RESET: ${{ inputs.reset_kill_switch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Restore the account from the cont-unic branch
        id: restore
        run: |
          mkdir -p state data
          if git fetch -q --depth=1 origin cont-unic 2>/dev/null \
              && git cat-file -e FETCH_HEAD:paper.sqlite 2>/dev/null; then
            git show FETCH_HEAD:paper.sqlite > state/paper.sqlite
            git show FETCH_HEAD:audit.jsonl > state/audit.jsonl 2>/dev/null || true
            echo "account=existing" >> "$GITHUB_OUTPUT"
          elif [ -n "$CAPITAL" ]; then
            echo "account=new" >> "$GITHUB_OUTPUT"
          else
            echo "account=none" >> "$GITHUB_OUTPUT"
            echo "Încă nu există contul unic. Pornește-l dintr-o rulare manuală cu capitalul virtual." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Take the council's votes
        if: steps.restore.outputs.account != 'none'
        run: |
          if git fetch -q --depth=1 origin consiliu-umbra 2>/dev/null \
              && git cat-file -e FETCH_HEAD:registry.sqlite 2>/dev/null; then
            git show FETCH_HEAD:registry.sqlite > state/registry.sqlite
          fi
          coins="$(python -c "from src.bnd.council_daily import BASE_PEERS; from src.bnd.crypto50 import EXTRA; print(','.join(BASE_PEERS + EXTRA))")"
          python -m src.bnd.crypto_signals --registry state/registry.sqlite --coins "$coins" --out state/semnale.json
      - name: Download the candles (ETF/forex and Yahoo crypto, then Binance coins)
        if: steps.restore.outputs.account != 'none'
        run: |
          names="$(python -c "from src.bnd.universe import UNIVERSES; print(','.join(m.name for m in UNIVERSES['unic']))")"
          groups="$(python -m src.bnd.crypto50 --split "$names")"
          etf="$(echo "$groups" | sed -n 's/^etf=//p')"
          yahoo_crypto="$(echo "$groups" | sed -n 's/^yahoo_crypto=//p')"
          binance="$(echo "$groups" | sed -n 's/^binance=//p')"
          start="$(date -u -d '-3 years' +%Y-%m-%d)"
          python -m src.bnd.backtest_cli fetch-universe --universe etf --markets "$etf" --start "$start" --out-dir data
          if [ -n "$yahoo_crypto" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe crypto --markets "$yahoo_crypto" --start "$start" --out-dir data
          fi
          if [ -n "$binance" ]; then
            python -m src.bnd.crypto50 --out data --only "$binance"
          fi
      - name: Daily step
        if: steps.restore.outputs.account != 'none'
        env:
          ACCOUNT: ${{ steps.restore.outputs.account }}
        run: |
          args=()
          if [ "$ACCOUNT" = new ]; then
            # Leverage maxim 2x, maxim 25% într-o piață, 60% într-o clasă (memecoin-urile au clasa lor).
            args+=(--capital "$CAPITAL" --universe unic --strategy hibrid
                   --max-leverage 2 --max-weight 0.25 --max-sector 60 --portfolio-vol 15 --financing 5)
          fi
          if [ -n "$RESET" ]; then args+=(--reset-kill-switch "$RESET"); fi
          python -m src.bnd.paper_runner --state state/paper.sqlite --data-dir data \
            --signals state/semnale.json --audit-log state/audit.jsonl \
            --report state/REPORT.md --json state/last_run.json "${args[@]}" > /dev/null
          cat state/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.restore.outputs.account != 'none'
        with:
          name: bnd-unic-${{ github.run_id }}
          path: state/
          if-no-files-found: ignore
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: step
    if: always() && needs.step.outputs.account != 'none' && needs.step.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RESULT: ${{ needs.step.result }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: bnd-unic-${{ github.run_id }}
          path: state
      - name: Commit the account to the cont-unic branch
        run: |
          set -euo pipefail
          if [ ! -f state/paper.sqlite ]; then echo "::warning::No account file"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          git init -q account
          cd account
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth=1 origin cont-unic 2>/dev/null; then
              git checkout -q -f -B cont-unic FETCH_HEAD
            else
              git checkout -q --orphan cont-unic 2>/dev/null || true
            fi
            cp ../state/paper.sqlite .
            if [ -f ../state/audit.jsonl ]; then cp ../state/audit.jsonl .; fi
            mkdir -p runs
            if [ -f ../state/REPORT.md ]; then cp ../state/REPORT.md README.md; fi
            if [ -f ../state/semnale.json ]; then cp ../state/semnale.json "runs/${day}-semnale.json"; fi
            if [ -f ../state/last_run.json ]; then cp ../state/last_run.json "runs/$day.json"; fi
            git add -A
            git commit -q -m "Pas cont unic $day, rularea $RUN_ID ($RESULT)" || true
            if git push -q origin HEAD:refs/heads/cont-unic; then break; fi
            if [ "$attempt" = 4 ]; then echo "::error::Could not save the account"; exit 1; fi
            sleep $((attempt * 5))
          done

name: Bot cripto virtual (AI)

# Cont virtual de cripto condus de consiliul AI. NU face apeluri plătite: după
# ce consiliul zilnic (consiliu-umbra.yml, 21:40 UTC) a votat pe monedele
# BITCOIN, ETHEREUM, SOLANA, BNB, XRP, citește voturile lui din registru și le
# transformă în ordine virtuale (long/short, dimensionate după volatilitate,
# cu stop). Contul trăiește pe ramura crypto-trading. Nu pornește singur:
# contul se creează dintr-o rulare manuală cu capitalul virtual confirmat.

# OPRIT (1.11.2026): contul a fost înlocuit de „Cont unic” (cont-unic.yml). Rămâne doar pornirea manuală,
# ca arhivă; nu mai rulează singur.
on:
  workflow_dispatch:
    inputs:
      capital:
        description: 'Capital virtual în dolari, doar ca să CREEZI contul (gol = continuă)'
        default: ''
        type: string
      reset_kill_switch:
        description: 'Scrie RESET-KILL-SWITCH ca să repornești după o oprire de siguranță'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-crypto-ai
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      account: ${{ steps.restore.outputs.account }}
    env:
      BND_ALLOW_LIVE_AI: "false"
      BND_TRADING_MODE: PAPER
      CAPITAL: ${{ inputs.capital }}
      RESET: ${{ inputs.reset_kill_switch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Restore the account from the crypto-trading branch
        id: restore
        run: |
          bash scripts/restore_account.sh crypto-trading "Încă nu există cont de cripto. Pornește-l dintr-o rulare manuală cu capitalul virtual."
      - name: Take the council's votes
        if: steps.restore.outputs.account != 'none'
        run: |
          # Votul consiliului e obligatoriu: fără el contul hibrid ar deveni pe tăcute doar pe reguli.
          bash scripts/restore_branch.sh consiliu-umbra state "!registry.sqlite"
          python -m src.bnd.crypto_signals --registry state/registry.sqlite --out state/semnale.json
      - name: Download the crypto candles
        if: steps.restore.outputs.account != 'none'
        run: |
          python -m src.bnd.backtest_cli fetch-universe --universe crypto \
            --start "$(date -u -d '-2 years' +%Y-%m-%d)" --out-dir data
      - name: Daily crypto step
        if: steps.restore.outputs.account != 'none'
        env:
          ACCOUNT: ${{ steps.restore.outputs.account }}
        run: |
          args=()
          if [ "$ACCOUNT" = new ]; then
            # 2x maxim (marja crypto 50%), toată expunerea poate sta în crypto, cost de finanțare 5%.
            args+=(--capital "$CAPITAL" --universe crypto --strategy ai_council
                   --max-leverage 2 --max-weight 0.6 --max-sector 200 --portfolio-vol 30 --financing 5)
          fi
          if [ -n "$RESET" ]; then args+=(--reset-kill-switch "$RESET"); fi
          python -m src.bnd.paper_runner --state state/paper.sqlite --data-dir data \
            --signals state/semnale.json --audit-log state/audit.jsonl \
            --report state/REPORT.md --json state/last_run.json "${args[@]}" > /dev/null
          cat state/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.restore.outputs.account != 'none'
        with:
          name: bnd-crypto-${{ github.run_id }}
          path: state/
          if-no-files-found: ignore
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: step
    if: always() && needs.step.outputs.account != 'none' && needs.step.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RESULT: ${{ needs.step.result }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: bnd-crypto-${{ github.run_id }}
          path: state
      - name: Commit the account to the crypto-trading branch
        run: |
          set -euo pipefail
          if [ ! -f state/paper.sqlite ]; then echo "::warning::No account file"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          git init -q account
          cd account
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth=1 origin crypto-trading 2>/dev/null; then
              git checkout -q -f -B crypto-trading FETCH_HEAD
            else
              git checkout -q --orphan crypto-trading 2>/dev/null || true
            fi
            cp ../state/paper.sqlite .
            if [ -f ../state/audit.jsonl ]; then cp ../state/audit.jsonl .; fi
            mkdir -p runs
            if [ -f ../state/REPORT.md ]; then cp ../state/REPORT.md README.md; fi
            if [ -f ../state/semnale.json ]; then cp ../state/semnale.json "runs/${day}-semnale.json"; fi
            if [ -f ../state/last_run.json ]; then cp ../state/last_run.json "runs/$day.json"; fi
            git add -A
            git commit -q -m "Pas cripto $day, rularea $RUN_ID ($RESULT)" || true
            if git push -q origin HEAD:refs/heads/crypto-trading; then break; fi
            if [ "$attempt" = 4 ]; then echo "::error::Could not save the account"; exit 1; fi
            sleep $((attempt * 5))
          done

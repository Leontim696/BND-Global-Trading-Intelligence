name: Date 12 ani pentru experimente

# Doar descarcă istoricul zilnic (gratuit, public) și îl pune ca artefact; experimentele rulează apoi offline.
# Nu folosește AI, chei sau scrieri în depozit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descarca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Download 12 years of daily candles
        run: |
          mkdir -p data
          python -m src.bnd.backtest_cli fetch-universe --universe etf \
            --markets SP500,NASDAQ100,GOLD,SILVER,CRUDE_OIL,EURUSD,USDJPY,US10Y_NOTE \
            --start 2014-10-01 --out-dir data
          python -m src.bnd.backtest_cli fetch-universe --universe crypto \
            --markets BITCOIN --start 2014-10-01 --out-dir data
          wc -l data/*.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: date-12-ani
          path: data/
          retention-days: 7

  # Separate job: the write token never runs project code.
  publica:
    needs: descarca
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: date-12-ani
          path: data
      - name: Save the candles on the date-12-ani branch
        run: |
          set -euo pipefail
          git init -q out && cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git checkout -q --orphan date-12-ani
          cp ../data/*.csv .
          git add -A
          git commit -q -m "Istoric zilnic 12 ani"
          git push -q -f origin HEAD:refs/heads/date-12-ani

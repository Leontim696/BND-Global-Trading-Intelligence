name: Formații AI (19 conturi-umbră, virtual)

# Cerut de proprietar pe 4.11.2026. 19 conturi-umbră virtuale (14 ale lui + 3 propuse: ponderat, consens 4/5, doar crypto + miză după convingere), fiecare cu altă formație de AI
# (GPT+Grok, fiecare AI singur, GPT+Claude+Grok; cu reguli și fără reguli), ca să vedem după 30.11 ce
# AI sau ce grupă de AI ia cele mai bune decizii. NU face niciun apel AI: refolosește voturile pe care
# consiliul zilnic le-a dat deja (registry.sqlite de pe consiliu-umbra), prin src/bnd/formations.py.
# Aceleași setări ca la contul unic (101 piețe, leverage 2x, 25% pe piață, 60% pe clasă, volatilitate 15%,
# finanțare 5%/an, 11.183 USD). Nu atinge contul unic sau contul de control (ramură separată: formatii-ai).

on:
  schedule:
    - cron: '50 22 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Ziua voturilor consiliului (AAAA-LL-ZZ, gol = azi). Doar pentru pornire, de ex. cu voturile de ieri.'
        default: ''
        type: string
      only:
        description: 'Doar această formație (ex. p10-convingere), ca să pornești un cont nou fără să le rulezi din nou pe celelalte'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-formatii-ai
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BND_ALLOW_LIVE_AI: "false"
      BND_TRADING_MODE: PAPER
      CAPITAL: "11183"
      DAY: ${{ inputs.day }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Restore the accounts and the council's votes
        run: |
          bash scripts/restore_branch.sh formatii-ai state
          bash scripts/restore_branch.sh consiliu-umbra council "!registry.sqlite"
      - name: Download the candles (ETF/forex and Yahoo crypto, then Binance coins)
        run: |
          names="$(python -c "from src.bnd.universe import UNIVERSES; print(','.join(m.name for m in UNIVERSES['unic']))")"
          groups="$(python -m src.bnd.crypto50 --split "$names")"
          etf="$(echo "$groups" | sed -n 's/^etf=//p')"
          yahoo_crypto="$(echo "$groups" | sed -n 's/^yahoo_crypto=//p')"
          binance="$(echo "$groups" | sed -n 's/^binance=//p')"
          defense="$(echo "$groups" | sed -n 's/^defense=//p')"
          stocks="$(echo "$groups" | sed -n 's/^stocks=//p')"
          start="$(date -u -d '-3 years' +%Y-%m-%d)"
          python -m src.bnd.backtest_cli fetch-universe --universe etf --markets "$etf" --start "$start" --out-dir data
          if [ -n "$yahoo_crypto" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe crypto --markets "$yahoo_crypto" --start "$start" --out-dir data
          fi
          if [ -n "$binance" ]; then
            python -m src.bnd.crypto50 --out data --only "$binance"
          fi
          if [ -n "$defense" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe defense --markets "$defense" --start "$start" --out-dir data
          fi
          if [ -n "$stocks" ]; then
            python -m src.bnd.backtest_cli fetch-universe --universe stocks --markets "$stocks" --start "$start" --out-dir data
          fi
      - name: Build the formation signals (no AI calls)
        run: |
          coins="$(python -c "from src.bnd.council_daily import BASE_PEERS; from src.bnd.crypto50 import EXTRA; from src.bnd.universe import DEFENSE_NAMES, STOCK_NAMES; print(','.join(BASE_PEERS + EXTRA + DEFENSE_NAMES + STOCK_NAMES))")"
          python -m src.bnd.formations --registry council/registry.sqlite --coins "$coins" --out-dir signals --data-dir data ${DAY:+--day "$DAY"}
      - name: Daily step for each formation (a failure in one does not stop the others)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          failed=0
          while IFS=$'\t' read -r key strategy title settings; do
            if [ -n "$ONLY" ] && [ "$key" != "$ONLY" ]; then continue; fi
            dir="state/$key"; mkdir -p "$dir" "prev/$key"
            args=(); flags=(--new)
            if [ -f "$dir/paper.sqlite" ]; then
              cp "$dir/paper.sqlite" "prev/$key/"
              [ -f "$dir/audit.jsonl" ] && cp "$dir/audit.jsonl" "prev/$key/"
              flags=(--previous "prev/$key")
            else
              read -r -a extra <<< "$settings"     # setările vin din src/bnd/formations.py (STANDARD sau AGGRESSIVE)
              args+=(--capital "$CAPITAL" --universe unic --strategy "$strategy" "${extra[@]}")
            fi
            if python -m src.bnd.paper_runner --state "$dir/paper.sqlite" --data-dir data \
                 --signals "signals/$key.json" --audit-log "$dir/audit.jsonl" \
                 --report "$dir/REPORT.md" --json "$dir/last_run.json" "${args[@]}" > /dev/null \
               && python -m src.bnd.state_check --state "$dir" "${flags[@]}" --run-id "$RUN_ID"; then
              echo "- $title: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Formația $title nu a trecut pasul zilnic; rămâne starea de ieri."
              rm -f "$dir/VALID.json"; failed=$((failed + 1))
            fi
          done < <(python -m src.bnd.formations --list)
          echo "Formații eșuate: $failed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bnd-formatii-${{ github.run_id }}
          path: state/
          if-no-files-found: error
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: step
    if: needs.step.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify_marker.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bnd-formatii-${{ github.run_id }}
          path: state
      - name: Commit the valid accounts to the formatii-ai branch
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          git init -q account
          cd account
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git fetch -q --depth=1 origin formatii-ai 2>/dev/null; then
              git checkout -q -f -B formatii-ai FETCH_HEAD
            else
              git checkout -q --orphan formatii-ai 2>/dev/null || true
            fi
            saved=0
            for dir in ../state/*/; do
              key=$(basename "$dir")
              # Doar o stare care a trecut de punctul de control (hash-uri verificate) se publică.
              if [ -f "$dir/VALID.json" ] && bash ../scripts/verify_marker.sh "$dir" >/dev/null; then
                mkdir -p "$key/runs"
                cp "$dir/paper.sqlite" "$dir/audit.jsonl" "$key/"
                cp "$dir/last_run.json" "$key/runs/$day.json"
                if [ -f "$dir/REPORT.md" ]; then cp "$dir/REPORT.md" "$key/README.md"; fi
                saved=$((saved + 1))
              else
                echo "::warning::$key nu are punct de control valid; nu se publică."
              fi
            done
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Formații AI $day: $saved conturi, rularea $RUN_ID"
            else
              echo "Nimic nou de salvat."
            fi
            if git push -q origin HEAD:refs/heads/formatii-ai; then break; fi
            if [ "$attempt" = 4 ]; then echo "::error::Could not save the accounts"; exit 1; fi
            sleep $((attempt * 5))
          done

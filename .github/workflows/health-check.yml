name: Verificare bot (dimineața)

# Every morning: is the virtual account running, is its kill switch off,
# did the last daily run succeed? Problems open (or update) one GitHub
# issue, which reaches the owner's phone through the GitHub app; when all
# is well again the issue is closed.

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read the account state (network step; the only one holding the token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token doar pentru comenzile de rețea (nu rămâne în .git/config pentru restul pașilor).
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          gitr() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b64" "$@"; }
          mkdir -p health
          state_err=""
          rc=0
          gitr ls-remote --exit-code origin refs/heads/cont-unic >/dev/null 2>&1 || rc=$?
          if [ "$rc" = 0 ]; then
            if gitr fetch -q --depth=1 origin cont-unic && git cat-file -e FETCH_HEAD:paper.sqlite 2>/dev/null; then
              git show FETCH_HEAD:paper.sqlite > health/paper.sqlite
            else
              state_err="nu pot descărca paper.sqlite de pe ramura cont-unic"
            fi
          elif [ "$rc" = 2 ]; then
            # Ramura lipsește: normal doar dacă contul n-a rulat niciodată cu succes.
            ever=$(gh run list -R "$REPO" --workflow cont-unic.yml --status success -L 1 --json conclusion \
              -q 'length' 2>/dev/null) || ever=unknown
            if [ "$ever" != 0 ]; then
              state_err="ramura cont-unic lipsește, deși contul a rulat înainte (ștearsă din greșeală?)"
            fi
          else
            state_err="nu pot verifica ramura cont-unic (cod $rc)"
          fi
          conclusion=$(gh run list -R "$REPO" --workflow cont-unic.yml -L 1 \
            --json conclusion -q '.[0].conclusion // ""' 2>/dev/null) || conclusion="unknown"
          printf '%s' "$conclusion" > health/conclusion.txt
          printf '%s' "$state_err" > health/state_err.txt
      - name: Check the account and the last daily run
        run: |
          conclusion="$(cat health/conclusion.txt)"
          state_err="$(cat health/state_err.txt)"
          # Dacă verificarea însăși crapă, tot trebuie să rezulte o alertă (nu tăcere).
          python -m src.bnd.health_check --state health/paper.sqlite --state-error "$state_err" \
            --last-run-conclusion "$conclusion" --json health/health.json > health/health.md || {
            echo '{"ok": false, "problems": ["verificarea de sănătate a crăpat"]}' > health/health.json
            echo "**Probleme găsite:** verificarea de sănătate a crăpat (vezi jurnalul rulării)." > health/health.md
          }
          cat health/health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Phone alert through ntfy (only when something is wrong)
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -f health/health.json ] && [ "$(jq -r .ok health/health.json)" != true ]; then
            python -m src.bnd.notify --title "BND: botul virtual are o problemă" \
              --message "$(head -c 900 health/health.md)" --priority high --require
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bnd-health-${{ github.run_id }}
          path: |
            health/health.json
            health/health.md
          retention-days: 7

  # Separate job: may write issues, never runs project code.
  alert:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TITLE: "Alertă: botul virtual are o problemă"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: bnd-health-${{ github.run_id }}
          path: health
      - name: Open, update or close the alert issue
        run: |
          set -euo pipefail
          if [ ! -f health/health.json ]; then
            # Jobul de verificare n-a produs nimic: asta e o problemă, nu liniște.
            mkdir -p health
            echo '{"ok": false}' > health/health.json
            echo "**Probleme găsite:** jobul de verificare nu a produs niciun rezultat (vezi rularea)." > health/health.md
          fi
          ok=$(jq -r '.ok' health/health.json)
          open=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            -q "[.[] | select(.title == \"$TITLE\") | .number][0] // empty")
          if [ "$ok" = true ]; then
            if [ -n "$open" ]; then
              gh api -X POST "repos/$REPO/issues/$open/comments" \
                -f body="Rezolvat: verificarea de azi este în regulă." > /dev/null
              gh api -X PATCH "repos/$REPO/issues/$open" -f state=closed > /dev/null
            fi
            exit 0
          fi
          if [ -n "$open" ]; then
            gh api -X POST "repos/$REPO/issues/$open/comments" \
              -F body=@health/health.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues" -f title="$TITLE" \
              -F body=@health/health.md > /dev/null
          fi

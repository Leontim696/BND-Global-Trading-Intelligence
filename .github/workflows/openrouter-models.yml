name: Lista modele OpenRouter (gratis)

# Reads OpenRouter's public model catalogue (no API key, no cost) and
# publishes it with real prices, so BND_MODEL_* values are exact.

on:
  workflow_dispatch:
    inputs:
      match:
        description: 'Optional: keep only model ids containing this text (e.g. opus, gemini)'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bnd-backtest-results
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BND_ALLOW_LIVE_AI: "false"
      MATCH: ${{ inputs.match }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Fetch the public catalogue
        run: |
          mkdir -p models
          python -m src.bnd.openrouter_models --match "$MATCH" > models/models.md
          cat models/models.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bnd-models-${{ github.run_id }}
          path: models/models.md
          retention-days: 7

  # Separate job: the write token never runs project code.
  publish:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bnd-models-${{ github.run_id }}
          path: models
      - name: Commit the list to the backtest-results branch
        run: |
          set -euo pipefail
          git init -q results
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            git fetch -q --depth=1 origin backtest-results
            git checkout -q -f -B backtest-results FETCH_HEAD
            mkdir -p models
            cp ../models/models.md "models/${RUN_ID}.md"
            cp ../models/models.md models/LATEST.md
            git add -A
            git commit -q -m "Lista de modele OpenRouter, rularea ${RUN_ID}"
            if git push -q origin HEAD:refs/heads/backtest-results; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Nu am putut salva lista"
          exit 1

name: BND OpenRouter Secret Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether OpenRouter secret is present (no API call)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is configured (value not displayed)."
          else
            echo "::error::OPENROUTER_API_KEY is missing or empty."
            exit 1
          fi

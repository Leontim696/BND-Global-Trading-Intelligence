
name: BND Python Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Flags read by the code; live and paid AI stay off.
      BND_ALLOW_LIVE_AI: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Lint GitHub workflows
        # A malformed workflow silently disappears from the Actions menu.
        run: |
          python -m pip install --disable-pip-version-check actionlint-py==1.7.12.25
          actionlint -color

      - name: Security scan (Bandit, medium severity and up)
        # Reviewed exceptions carry "# nosec <id>" with the reason above them.
        run: |
          python -m pip install --disable-pip-version-check bandit==1.8.6
          bandit -q -r src scripts -ll

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              p for p in Path(".").rglob("*.py")
              if not any(
                  part.startswith(".") or part == "__pycache__"
                  for part in p.parts
              )
          ]

          for file in files:
              ast.parse(file.read_text(encoding="utf-8"), filename=str(file))
              print(f"OK: {file}")

          print(f"Validated {len(files)} Python files")
          PY

      - name: Run unit tests if present
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          tests = Path("tests")
          test_files = list(tests.rglob("test_*.py")) if tests.exists() else []

          if not test_files:
              print("No Python unit tests yet.")
          else:
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q"],
                  check=True
              )
          PY

name: Raport bot virtual (de 5 ori pe zi)

# Five reports a day for the 16-day forward test: account value now (live
# prices for open positions), positions, orders, risk. Saved on the
# paper-trading branch (rapoarte/) and posted as a comment on one issue,
# which reaches the owner's phone through the GitHub app. After the test
# period (16 days from the account's creation) nothing more is posted.

on:
  schedule:
    # UTC. Romania (UTC+2): 08:00, 11:30, 15:30, 19:00, 00:50 (after the
    # daily paper step at 22:23 UTC).
    - cron: '0 6 * * *'
    - cron: '30 9 * * *'
    - cron: '30 13 * * *'
    - cron: '0 17 * * *'
    - cron: '50 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Same group as the daily paper step: both write to the paper-trading branch.
concurrency:
  group: bnd-paper-trading
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      post: ${{ steps.build.outputs.post }}
    env:
      BND_ALLOW_LIVE_AI: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Read the account and build the report
        id: build
        run: |
          mkdir -p raport
          if git fetch -q --depth=1 origin paper-trading 2>/dev/null \
              && git cat-file -e FETCH_HEAD:paper.sqlite 2>/dev/null; then
            git show FETCH_HEAD:paper.sqlite > raport/paper.sqlite
          fi
          python -m src.bnd.report_card --state raport/paper.sqlite \
            --out raport/raport.md --json raport/raport.json > /dev/null
          cat raport/raport.md >> "$GITHUB_STEP_SUMMARY"
          # Post only while the account exists and the 16-day test is running.
          day=$(jq -r 'if .has_account then .day else 0 end' raport/raport.json)
          if [ "$day" -ge 1 ] && [ "$day" -le 17 ]; then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bnd-raport-${{ github.run_id }}
          path: |
            raport/raport.md
            raport/raport.json
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: report
    if: needs.report.outputs.post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TITLE: "Rapoarte bot virtual (test de 16 zile)"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bnd-raport-${{ github.run_id }}
          path: raport
      - name: Save the report on the paper-trading branch
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d_%H%M)
          git init -q out
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            git fetch -q --depth=1 origin paper-trading
            git checkout -q -f -B paper-trading FETCH_HEAD
            mkdir -p rapoarte
            cp ../raport/raport.md "rapoarte/${stamp}.md"
            cp ../raport/raport.md rapoarte/LATEST.md
            git add -A
            git commit -q -m "Raport ${stamp}"
            if git push -q origin HEAD:refs/heads/paper-trading; then break; fi
            sleep $((attempt * 5))
          done
      - name: Post the report on the reports issue
        run: |
          set -euo pipefail
          number=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            -q "[.[] | select(.title == \"$TITLE\") | .number][0] // empty")
          if [ -z "$number" ]; then
            number=$(gh api -X POST "repos/$REPO/issues" -f title="$TITLE" \
              -f body="Aici apar rapoartele botului virtual, de 5 ori pe zi, timp de 16 zile. Ultimul raport este și în fișierul rapoarte/LATEST.md de pe ramura paper-trading." \
              -q .number)
          fi
          gh api -X POST "repos/$REPO/issues/$number/comments" -F body=@raport/raport.md > /dev/null

name: Raport bot virtual (orar)

# An hourly report for the 16-day forward test: account value now (live
# prices for open positions), positions, orders, risk. Saved on the
# paper-trading branch (rapoarte/) and posted as a comment on one issue per
# day, which reaches the owner's phone through the GitHub app. After the
# test period (16 days from the account's creation) nothing more is posted.

on:
  schedule:
    # Every hour, on the hour: full report (saved + posted). GitHub may delay a run by a few minutes.
    - cron: '0 * * * *'
    # (Varianta la 30 de minute a fost oprită pe 3.11: planul GitHub gratuit are 2.000 de minute/lună.)
  workflow_dispatch:

permissions:
  contents: read

# Same group as the daily paper step: both write to the paper-trading branch.
concurrency:
  group: bnd-paper-trading
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      post: ${{ steps.build.outputs.post }}
      light: ${{ github.event.schedule == '30 * * * *' }}
    env:
      BND_ALLOW_LIVE_AI: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Read the account and build the report
        id: build
        run: |
          mkdir -p raport
          # Raportul orar urmărește acum contul unic (cont-unic); rapoartele rămân pe ramura paper-trading.
          if git fetch -q --depth=1 origin cont-unic 2>/dev/null \
              && git cat-file -e FETCH_HEAD:paper.sqlite 2>/dev/null; then
            git show FETCH_HEAD:paper.sqlite > raport/paper.sqlite
          fi
          python -m src.bnd.report_card --state raport/paper.sqlite \
            --out raport/raport.md --json raport/raport.json > /dev/null
          cat raport/raport.md >> "$GITHUB_STEP_SUMMARY"
          # Post only while the account exists and the test is running (31.10–30.11.2026 = zilele 1–31).
          day=$(jq -r 'if .has_account then .day else 0 end' raport/raport.json)
          if [ "$day" -ge 1 ] && [ "$day" -le 31 ]; then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Current prices for the phone app
        run: python -m src.bnd.quotes_snapshot --out raport/quotes.json || echo "::warning::cursurile de acum nu s-au putut citi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bnd-raport-${{ github.run_id }}
          path: |
            raport/raport.md
            raport/raport.json
            raport/quotes.json
          retention-days: 14

  # Separate job: the write token never runs project code.
  publish:
    needs: report
    if: needs.report.outputs.post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LIGHT: ${{ needs.report.outputs.light }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bnd-raport-${{ github.run_id }}
          path: raport
      - name: Save the report on the paper-trading branch
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d_%H%M)
          git init -q out
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          pushed=0
          for attempt in 1 2 3; do
            git fetch -q --depth=1 origin paper-trading
            git checkout -q -f -B paper-trading FETCH_HEAD
            mkdir -p rapoarte
            if [ "$LIGHT" != "true" ]; then cp ../raport/raport.md "rapoarte/${stamp}.md"; fi
            cp ../raport/raport.md rapoarte/LATEST.md
            if [ -f ../raport/quotes.json ]; then cp ../raport/quotes.json rapoarte/quotes.json; fi
            git add -A
            git commit -q -m "Raport ${stamp}"
            if git push -q origin HEAD:refs/heads/paper-trading; then pushed=1; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::Nu am putut salva pe ramură după 3 încercări."; exit 1; }
      - name: Post the report on today's reports issue
        if: needs.report.outputs.light != 'true'
        run: |
          set -euo pipefail
          title="Rapoarte bot virtual $(date -u +%Y-%m-%d)"
          number=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            -q "[.[] | select(.title == \"$title\") | .number][0] // empty")
          if [ -z "$number" ]; then
            number=$(gh api -X POST "repos/$REPO/issues" -f title="$title" \
              -f body="Rapoartele orare ale botului virtual pentru ziua de azi (ora UTC). Ultimul raport este și în rapoarte/LATEST.md de pe ramura paper-trading." \
              -q .number)
          fi
          gh api -X POST "repos/$REPO/issues/$number/comments" -F body=@raport/raport.md > /dev/null
          # Close the earlier days' report issues, so only today's stays open.
          for old in $(gh api "repos/$REPO/issues?state=open&per_page=100" \
              -q ".[] | select((.title | startswith(\"Rapoarte bot virtual \")) and .title != \"$title\") | .number"); do
            gh api -X PATCH "repos/$REPO/issues/$old" -f state=closed > /dev/null
          done

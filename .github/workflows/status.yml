name: Stare sistem (JSON și alerte)

# O dată pe oră, după raportul orar: citește conturile virtuale, registrul consiliului și
# prețurile de acum, calculează starea sistemului (reconciliere contabilă, drawdown, costuri
# AI, starea agenților, rulări eșuate) și o salvează ca status.json pe ramura `status`.
# Senzorii (de exemplu Home Assistant, cu un token de citire) citesc acel fișier. Alertele
# noi (fără repetiții, pauză 12 ore) merg pe telefon prin ntfy, dacă secretul NTFY_TOPIC
# există. Nu tranzacționează și nu cheamă AI plătit.

on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bnd-status
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      BND_ALLOW_LIVE_AI: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Read the accounts, the council and the prices
        env:
          GH_TOKEN: ${{ github.token }}      # doar aici: descărcarea ramurilor și lista rulărilor
        run: |
          # Token doar pentru comenzile de rețea (nu rămâne în .git/config pentru restul pașilor).
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          gitr() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b64" "$@"; }
          mkdir -p out/p out/c out/a out/k out/r out/u
          grab() { # ramură fișier destinație
            if gitr fetch -q --depth=1 origin "$1" 2>/dev/null && git cat-file -e "FETCH_HEAD:$2" 2>/dev/null; then
              git show "FETCH_HEAD:$2" > "$3"
            fi
          }
          grab paper-trading paper.sqlite out/p/paper.sqlite
          grab paper-trading rapoarte/quotes.json out/quotes.json
          grab crypto-trading paper.sqlite out/c/paper.sqlite
          grab ai-unificat paper.sqlite out/a/paper.sqlite
          grab reguli-ls paper.sqlite out/r/paper.sqlite
          grab cont-unic paper.sqlite out/u/paper.sqlite
          grab cont-unic expuneri.json out/expuneri.json
          grab consiliu-umbra registry.sqlite out/k/registry.sqlite
          grab consiliu-umbra costs.sqlite out/k/costs.sqlite
          grab status alerts.json out/alerts.json
          gh run list -R "$GITHUB_REPOSITORY" -L 40 --json workflowName,event,conclusion,createdAt > out/runs.json
      - name: Read the real OpenRouter balance (read-only, free)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.bnd.openrouter_balance --out out/balance.json
      - name: Build the status
        run: |
          python -m src.bnd.dashboard --paper out/p --crypto out/c --ai out/a --rls out/r --unic out/u --council out/k \
            --quotes out/quotes.json --runs out/runs.json --balance out/balance.json --exposure out/expuneri.json \
            --template src/bnd/dashboard_template.html --out out/app.html --status-json out/status.json
          cat out/status.json >> "$GITHUB_STEP_SUMMARY"
      - name: New alerts to the phone (no repeats)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}      # doar aici; pasul de construire a stării nu îl vede
        run: python -m src.bnd.alerting --status out/status.json --state out/alerts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bnd-status-${{ github.run_id }}
          path: |
            out/status.json
            out/alerts.json
            out/balance.json
          retention-days: 3

  # Separate job: the write token never runs project code.
  publish:
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bnd-status-${{ github.run_id }}
          path: out
      - name: Save status.json on the status branch
        run: |
          set -euo pipefail
          git init -q s && cd s
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          pushed=0
          for attempt in 1 2 3; do
            if git fetch -q --depth=1 origin status 2>/dev/null; then
              git checkout -q -f -B status FETCH_HEAD
            else
              git checkout -q --orphan status 2>/dev/null || true
            fi
            cp ../out/status.json status.json
            if [ -f ../out/alerts.json ]; then cp ../out/alerts.json alerts.json; fi
            if [ -f ../out/balance.json ]; then cp ../out/balance.json balance.json; fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Stare $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              echo "Nimic nou de salvat."
            fi
            if git push -q origin HEAD:refs/heads/status; then pushed=1; break; fi
            sleep $((attempt * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::Nu am putut salva pe ramură după 3 încercări."; exit 1; }

<title>BND Trading</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;800&family=Unbounded:wght@400;500;700&display=swap">
<style>
/* Concept: panou de comandă pe întuneric (ink + cyan de gheață), sticlă mată, inele și hărți de căldură.
   Dark-first; tema deschisă oglindește aceleași jetoane. Roșu/verde doar pentru pierdere/câștig, chihlimbar pentru atenție. */
:root{
  --bg:#060a12; --bg-2:#0a1120; --surface:#0e1626; --glass:rgba(16,26,44,.66); --raise:#142038;
  --line:rgba(140,170,220,.15); --line-2:rgba(140,170,220,.30); --fg:#e9effc; --muted:#8c9dbd;
  --accent:#69e2ff; --accent-2:#5b8cff; --accent-soft:rgba(105,226,255,.13); --on-accent:#031018;
  --gain:#36d99a; --loss:#ff6b84; --warn:#ffb648;
  --glow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.45);
  --mesh-a:rgba(105,226,255,.15); --mesh-b:rgba(91,140,255,.13); --grid:rgba(140,170,220,.055);
  --c1:#69e2ff; --c2:#5b8cff; --c3:#ffb648; --c4:#c78bff; --c5:#ff6b84; --c6:#9be564; --c7:#36d99a; --c8:#9aa7bd;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#edf2fa; --bg-2:#e4ecf8; --surface:#ffffff; --glass:rgba(255,255,255,.80); --raise:#f4f7fc;
  --line:rgba(10,25,60,.12); --line-2:rgba(10,25,60,.24); --fg:#0a1224; --muted:#52638a;
  --accent:#0877a0; --accent-2:#2f5fe0; --accent-soft:rgba(8,119,160,.10); --on-accent:#ffffff;
  --gain:#0e8a5b; --loss:#c4304b; --warn:#9a6200;
  --glow:0 0 0 1px var(--line),0 12px 32px rgba(20,40,90,.10);
  --mesh-a:rgba(8,119,160,.11); --mesh-b:rgba(47,95,224,.09); --grid:rgba(10,25,60,.05);
  --c1:#0877a0; --c2:#2f5fe0; --c3:#b06500; --c4:#8240c0; --c5:#c4304b; --c6:#4d7d12; --c7:#0e8a5b; --c8:#667085; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#edf2fa; --bg-2:#e4ecf8; --surface:#ffffff; --glass:rgba(255,255,255,.80); --raise:#f4f7fc;
  --line:rgba(10,25,60,.12); --line-2:rgba(10,25,60,.24); --fg:#0a1224; --muted:#52638a;
  --accent:#0877a0; --accent-2:#2f5fe0; --accent-soft:rgba(8,119,160,.10); --on-accent:#ffffff;
  --gain:#0e8a5b; --loss:#c4304b; --warn:#9a6200;
  --glow:0 0 0 1px var(--line),0 12px 32px rgba(20,40,90,.10);
  --mesh-a:rgba(8,119,160,.11); --mesh-b:rgba(47,95,224,.09); --grid:rgba(10,25,60,.05);
  --c1:#0877a0; --c2:#2f5fe0; --c3:#b06500; --c4:#8240c0; --c5:#c4304b; --c6:#4d7d12; --c7:#0e8a5b; --c8:#667085; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 45% at 12% -8%,var(--mesh-a),transparent 70%),radial-gradient(55% 40% at 100% 8%,var(--mesh-b),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px;
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
main{max-width:1080px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
/* barul de sus */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brand{min-width:0;flex:1 1 260px}
.mark{font:700 18px/1 var(--font-display);letter-spacing:.06em}
.mark b{color:var(--accent);font-weight:700}
.stamp{display:flex;align-items:center;gap:7px;color:var(--muted);font:400 11.5px var(--font-data);margin-top:7px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--gain);box-shadow:0 0 0 0 var(--gain);flex:0 0 auto}
.pulse.warn{background:var(--warn)}.pulse.old{background:var(--loss)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:ping 2.4s infinite}@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gain) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}}
.tools{display:flex;gap:8px;align-items:center;flex:0 1 auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 11px;font:600 12px var(--font-body);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--gain);display:inline-block}
.chip.bad{border-color:var(--loss);color:var(--loss)}.chip.bad i{background:var(--loss)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover,.chip:hover{border-color:var(--accent)}
/* bara lipicioasă: căutare + categorii */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding-block:6px 8px;margin-inline:-6px;padding-inline:6px;
  background:linear-gradient(var(--bg) 88%,transparent)}
.search{display:flex;gap:8px;align-items:center}
.search input,.search select{height:40px;border:1px solid var(--line-2);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:0 13px;min-width:0}
.search input{flex:1 1 auto}.search input::placeholder{color:var(--muted)}
.search select{flex:0 0 auto;max-width:44%}
.filters,.signals,.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters{padding-top:8px}.signals{padding-block:4px 2px}
.filters::-webkit-scrollbar,.signals::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.filters button,.seg button{flex:0 0 auto;border:1px solid var(--line-2);background:var(--glass);font:600 12.5px var(--font-body);padding:6px 12px;border-radius:999px;white-space:nowrap}
.filters button small{color:var(--muted);font-weight:500;margin-left:4px}
.filters button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{margin-block:10px 4px}
.sig{flex:0 0 auto;font:500 12px var(--font-data);padding:4px 9px;border-radius:8px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;background:var(--glass)}
.sig.buy{color:var(--gain);border-color:var(--gain)}.sig.sell{color:var(--loss);border-color:var(--loss)}
.sg{flex:0 0 auto;align-self:center;font:700 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0 2px 0 8px;white-space:nowrap}
/* navigare: bară jos pe telefon, șină laterală pe ecran mare */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg-2) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line-2);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.dock-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:720px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font:600 10.5px var(--font-body);padding:8px 2px;border-radius:14px;min-width:0;position:relative}
.dock button svg{width:22px;height:22px}
.dock button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.dock button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
@media (min-width:980px){
  body{padding-left:max(104px,env(safe-area-inset-left,0px))}
  .dock{inset:0 auto 0 0;width:84px;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line-2);padding:16px 8px}
  .dock-in{grid-template-columns:1fr;gap:8px}
  .dock button[aria-selected="true"]::after{top:25%;bottom:25%;left:0;right:auto;width:2px;height:auto}
  .bar{margin-inline:0}}
/* carduri de sticlă */
.panel{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--glow);padding:18px;margin-block:12px;min-width:0}
.panel.hot{border-color:var(--line-2);background:linear-gradient(160deg,var(--accent-soft),transparent 45%),var(--glass)}
button.panel{color:inherit;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.grid>.panel{margin-block:0}
.label{color:var(--muted);font:700 10.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase}
.hero-value{font:500 clamp(30px,8.4vw,46px)/1.05 var(--font-display);letter-spacing:-.02em;margin-top:8px}
.hero-value small{font:500 .38em var(--font-data);color:var(--muted);letter-spacing:0;margin-left:6px}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--font-data);padding:4px 10px;border-radius:999px;border:1px solid var(--line-2)}
.tag.gain{color:var(--gain);border-color:color-mix(in srgb,var(--gain) 55%,transparent);background:color-mix(in srgb,var(--gain) 10%,transparent)}
.tag.loss{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 55%,transparent);background:color-mix(in srgb,var(--loss) 10%,transparent)}
.gain{color:var(--gain)}.loss{color:var(--loss)}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.empty{color:var(--muted);padding:18px 0}
h2{font:700 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin:28px 0 10px;color:var(--fg)}
h2::before{content:"";display:inline-block;width:18px;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);vertical-align:middle;margin-right:10px;border-radius:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line-2);background:var(--glass);border-radius:12px;padding:8px 13px;font:600 12.5px var(--font-body)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.alert{border:1px solid var(--loss);color:var(--loss);border-radius:14px;padding:10px 14px;margin-block:8px;font-weight:700;background:var(--glass)}
.notice{border:1px solid var(--warn);color:var(--warn);border-radius:14px;padding:12px 14px;margin-block:14px;background:var(--glass)}
/* grafice */
.chart{margin-block:16px 4px;position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--fg);color:var(--bg);font:500 11.5px var(--font-data);padding:3px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0}
.ringbox{display:flex;align-items:center;gap:16px}
.ring{flex:0 0 auto}
.ring .arc{filter:drop-shadow(0 0 5px var(--accent));transition:stroke-dashoffset .6s ease}
.ring text{fill:var(--fg);font:500 21px var(--font-display);text-anchor:middle}
.ring text.s{fill:var(--muted);font:500 8px var(--font-data);letter-spacing:.06em}
.tl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;margin-top:14px}
.tl span{height:8px;border-radius:3px;background:var(--line)}
.tl span.on{background:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}
.tl span.now{background:var(--fg)}
.miles{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:500 11.5px var(--font-data);color:var(--muted)}
.miles span{display:inline-flex;gap:6px;align-items:center}.miles span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-block:14px}
.stats div{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stats b{display:block;font:500 17px var(--font-data);font-variant-numeric:tabular-nums;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:8px}
.split .l{background:var(--gain)}.split .s{background:var(--loss)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pf-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 14px}
.pf-head div{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pf-head b{display:block;font:600 18px var(--font-data);font-variant-numeric:tabular-nums;margin-top:2px}
.pf-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pf-row,.pf-cols{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr 1.3fr 1fr .8fr;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-inline:0;border-top:0;color:inherit;font:inherit}
.pf-cols{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.pf-row .n{font:500 14px var(--font-data);font-variant-numeric:tabular-nums;text-align:right}
.pf-row .px{color:var(--muted);font-size:12.5px;text-align:right}
.pf-cols span:not(:first-child){text-align:right}
.pf-bar{grid-column:1/-1;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:-4px}
.pf-bar span{display:block;height:100%}
@media (max-width:759px){.pf-head{grid-template-columns:repeat(2,minmax(0,1fr))}.pf-row,.pf-cols{grid-template-columns:minmax(100px,1.3fr) 1fr 1fr .8fr}.pf-row .px,.pf-cols .px{display:none}}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-inline:0;border-top:0}
.row .name{font-weight:700}.row .num{font:500 14px var(--font-data);font-variant-numeric:tabular-nums;text-align:right}
.row .meta{color:var(--muted);font-size:12.5px}
.pbar{height:4px;border-radius:3px;background:var(--line);margin-top:8px;grid-column:1/-1;overflow:hidden}
.pbar span{display:block;height:100%}
.pill{display:inline-block;font:700 10.5px var(--font-body);letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.pill.short{background:transparent;border:1px solid var(--loss);color:var(--loss)}
.grp{display:flex;justify-content:space-between;gap:8px;margin-top:20px;padding-bottom:5px;border-bottom:1px solid var(--line-2);font:700 12px var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.grp small{color:var(--muted);font-weight:400}.grp-t{font:500 12px var(--font-data);text-transform:none;letter-spacing:0}
/* hartă de căldură */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;margin-top:10px}
.tile{--t:0;border:1px solid var(--line);border-radius:12px;padding:8px 6px 7px;text-align:center;background:var(--glass);min-width:0;position:relative}
.tile.up{background:color-mix(in srgb,var(--gain) calc(var(--t)*62%),var(--glass));border-color:color-mix(in srgb,var(--gain) calc(var(--t)*80%),var(--line))}
.tile.down{background:color-mix(in srgb,var(--loss) calc(var(--t)*62%),var(--glass));border-color:color-mix(in srgb,var(--loss) calc(var(--t)*80%),var(--line))}
.tile b{display:block;font:700 11px var(--font-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{display:block;font:600 12.5px var(--font-data);margin-top:2px}
.tile.fav::after{content:"★";position:absolute;top:3px;right:5px;font-size:9px;color:var(--warn)}
.tile:hover{border-color:var(--accent)}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.strip i{width:10px;height:10px;border-radius:3px;background:var(--line);display:block}
.strip i.up{background:var(--gain)}.strip i.down{background:var(--loss)}
.votes{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.v{font:500 11.5px var(--font-data);padding:3px 7px;border-radius:7px;border:1px solid var(--line-2);color:var(--muted)}
.v.BUY{color:var(--gain);border-color:var(--gain)}.v.SELL{color:var(--loss);border-color:var(--loss)}
.vbar{display:flex;gap:3px;margin-top:8px}
.vbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.vbar .BUY{background:var(--gain)}.vbar .SELL{background:var(--loss)}
.matrix{display:grid;gap:4px;margin-top:10px}
.matrix div{display:grid;gap:4px;grid-template-columns:70px repeat(var(--n),1fr)}
.matrix span{font:500 11.5px var(--font-data);text-align:center;padding:7px 0;border-radius:8px;background:color-mix(in srgb,var(--accent) calc(var(--p,0)*55%),var(--glass))}
.matrix b{font:700 11px var(--font-body);color:var(--muted);align-self:center;overflow:hidden;text-overflow:ellipsis}
.matrix .h span{background:none;color:var(--muted);font:700 10px var(--font-body);padding:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--muted);font:700 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line-2)}
th button{all:unset;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
th button:focus-visible{outline:2px solid var(--accent)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;font:500 12px var(--font-data);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font-body);font-weight:700}
tr[data-m]{cursor:pointer}tr[data-m]:hover td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.mover{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:left}
.mover:last-child{border-bottom:0}
.feed{display:grid;gap:10px;margin-top:10px}
.feed div{display:flex;gap:10px;font-size:13.5px}
.feed i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;box-shadow:0 0 8px var(--accent)}
.feed i.bad{background:var(--loss);box-shadow:0 0 8px var(--loss)}
.sys{display:grid;gap:8px;margin-top:10px}
.sys div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.sys small{color:var(--muted);font:400 11.5px var(--font-data)}
.meter{margin-top:12px}
.meter .top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.meter .bar2{height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.meter .bar2 span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.warn .bar2 span{background:var(--warn)}.meter.bad .bar2 span{background:var(--loss)}
.brief{display:grid;gap:9px;margin-top:10px}
.brief p{margin:0;font-size:14.5px}
.brief b{font-weight:800}
.next{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.next span{border:1px solid var(--line-2);border-radius:12px;padding:7px 11px;font:500 12px var(--font-data);background:var(--glass)}

let CHARTS = {};
// live: {v, t} = valoarea cu prețurile de acum; se desenează punctat după ultima închidere, marcat „acum”.
function spark(history, initial, key, big, live) {
  const pts = history.map(h => ({v:h.equity, t:h.t})); if (initial != null) pts.unshift({v:initial, t:null});
  const closes = pts.length; if (live && isFinite(live.v) && pts.length) pts.push({v:live.v, t:live.t, now:true});
  if (pts.length < 2 || Math.max(...pts.map(p => p.v)) === Math.min(...pts.map(p => p.v)))
    return `<p class="sub" style="margin-block:14px">Graficul apare când valoarea contului începe să se miște.</p>`;
  const W = big ? 640 : 320, H = big ? 190 : 100, P = big ? 10 : 6, vals = pts.map(p => p.v), lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const x = i => P + i * (W - 2*P) / (pts.length - 1), y = v => H - P - (v - lo) / span * (H - 2*P);
  const line = vals.slice(0, closes).map((v,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const hasNow = pts.length > closes, last = pts.length - 1;
  const nowSeg = hasNow ? `M${x(closes - 1).toFixed(1)} ${y(vals[closes - 1]).toFixed(1)} L${x(last).toFixed(1)} ${y(vals[last]).toFixed(1)}` : "";
  const col = vals[vals.length-1] >= vals[0] ? "var(--gain)" : "var(--loss)", gid = "g" + key;
  CHARTS[key] = {pts, W, x, y};
  const ax = hasNow ? W - P - 14 : W - P;   // eticheta nu stă sub punctul „acum”
  const axis = big ? `<text class="axis" x="${ax}" y="${P+6}" text-anchor="end">${esc(money(hi, ""))}</text><text class="axis" x="${ax}" y="${H-P-3}" text-anchor="end">${esc(money(lo, ""))}</text>
    <text class="axis" x="${P}" y="${H-1}">${esc(pts[0].t ? dayOnly(pts[0].t) : "start")}</text><text class="axis" x="${W-P}" y="${H-1}" text-anchor="end">${esc(hasNow ? "acum" : dayOnly(pts[pts.length-1].t || DATA.generated))}</text>` : "";
  return `<div class="chart${big ? " big" : ""}" data-chart="${key}"><div class="tip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valoarea contului în timp">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P}" x2="${W-P}" y1="${y(vals[0])}" y2="${y(vals[0])}" stroke="var(--line-2)" stroke-dasharray="3 4"/>
    <path d="${line} L${x(closes-1)} ${H-P} L${x(0)} ${H-P} Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px ${col})"/>
    ${hasNow ? `<path d="${nowSeg}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="4 4"/><circle cx="${x(last).toFixed(1)}" cy="${y(vals[last]).toFixed(1)}" r="5.5" fill="var(--bg, #fff)" stroke="${col}" stroke-width="2"><title>Valoarea cu prețurile de acum</title></circle>` : ""}
    <line class="cur" x1="0" x2="0" y1="${P}" y2="${H-P}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    <circle class="dot" cx="${x(pts.length-1)}" cy="${y(vals[vals.length-1])}" r="3.8" fill="${col}"/>${axis}</svg></div>`;
}
view.addEventListener("pointermove", e => {

function ring(frac, big, small, name, size) {

function briefing() {
  const a = DATA.accounts.find(x => x.key === "unic"), c = DATA.council, out = [];
  if (a && a.exists) {
    const v = eq(a), ch = 100 * (v / a.initial - 1);
    out.push(`<p>Contul unic are <b>${fm(v, a)}</b> (<span class="${ch >= 0 ? "gain" : "loss"}">${pct(ch)}</span> față de start), <b>${a.positions.length}</b> poziții deschise și <b>${a.orders.length}</b> ordine pentru mâine.</p>`);
    if (a.orders.length) { const k = {long:0, short:0, "închide":0}; a.orders.forEach(o => k[o.kind] = (k[o.kind] || 0) + 1);
      out.push(`<p>La deschiderea următoare: <b>${k.long}</b> cumpărări, <b>${k.short}</b> vânzări short, <b>${k["închide"]}</b> închideri.</p>`); }
    const near = riskRows(a).sort((x, y) => y.ratio - x.ratio)[0];
    if (near && a.positions.length) out.push(`<p>Cel mai aproape de o limită: <b>${esc(near.name.toLowerCase())}</b>, la ${Math.round(100 * near.ratio)}% din plafon.</p>`);
    if (a.kill_switch) out.push(`<p class="loss"><b>Oprire de siguranță activă</b>: nu se mai deschid poziții noi.</p>`);
  }
  if (c && c.exists && c.day) {
    const ms = c.markets || [], up = ms.filter(m => m.net > 0).length, down = ms.filter(m => m.net < 0).length;
    const split = ms.filter(m => Object.values(m.votes).includes("BUY") && Object.values(m.votes).includes("SELL")).length;
    out.push(`<p>Consiliul din <b>${esc(c.day)}</b>: <span class="gain">${up}</span> piețe spre cumpărare, <span class="loss">${down}</span> spre vânzare, ${split} cu dezacord între agenți.</p>`);
    const fl = (c.history && c.history.flips) || [];
    const flipNames = fl.slice(0, 3).map(f => "<b>" + esc(label(f.symbol)) + "</b>").join(", ") + (fl.length > 3 ? "…" : "");
    if (c.history && c.history.flips_between) out.push(`<p>Față de ziua precedentă, <b>${fl.length}</b> ${fl.length === 1 ? "piață și-a schimbat" : "piețe și-au schimbat"} partea${fl.length ? ": " + flipNames : ""}.</p>`);
    const strong = ms.filter(m => m.bot).map(m => ({m, c: combo(m)})).filter(x => x.c && sgn(x.m.bot) === sgn(x.m.net)).sort((x, y) => Math.abs(y.c) - Math.abs(x.c)).slice(0, 3);
    const names = strong.map(x => "<b>" + esc(label(x.m.symbol)) + "</b> " + (x.c > 0 ? "▲" : "▼")).join(", ");
    if (strong.length) out.push(`<p>Cele mai clare semnale (reguli și consiliu de acord): ${names}.</p>`);
  }
  const bad = (DATA.alerts || []).length;
  if (bad) out.push(`<p class="loss"><b>${bad}</b> ${bad === 1 ? "alertă activă" : "alerte active"}: vezi sus.</p>`);
  return `<div class="panel hot"><div class="label">Azi pe scurt</div><div class="brief">${out.join("") || `<p class="sub">Încă nu sunt date.</p>`}</div>${nextRunsHtml()}</div>`;
}

const berlin = new Intl.DateTimeFormat("ro-RO", {timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short", hourCycle: "h23"});
function tickClock() {
  const p = Object.fromEntries(berlin.formatToParts(new Date()).map(x => [x.type, x.value]));
  const mins = +p.hour * 60 + +p.minute, weekday = !/^(sâm|dum|sb|sa|du|su)/i.test(p.weekday);
  const us = weekday && mins >= 15 * 60 + 30 && mins < 22 * 60;          // bursa din SUA, ora Germaniei (aproximativ, fără sărbători)

function countUp(root) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll("[data-cu]").forEach(el => {
    const node = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.nodeValue)); if (!node) return;
    const m = node.nodeValue.match(/\d[\d.]*(?:,\d+)?/); if (!m) return;
    const target = parseFloat(m[0].replace(/\./g, "").replace(",", ".")); if (!isFinite(target)) return;
    const dec = (m[0].split(",")[1] || "").length, t0 = performance.now(), base = node.nodeValue;
    const step = now => { const k = Math.min(1, (now - t0) / 750), e = 1 - Math.pow(1 - k, 3);
      node.nodeValue = k < 1 ? base.replace(m[0], nf(dec, dec).format(target * e)) : base; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// roata de sentiment: câte o pană pe categorie; spre exterior = mai multe voturi de cumpărare, spre interior = de vânzare
function polar(rows) {
  const n = rows.length; if (!n) return "";
  const cx = 100, cy = 100, r0 = 52, span = 28, gap = 0.05, pt = (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)], f = v => v.toFixed(1);
  const wedge = (ra, rb, a0, a1) => { const A = pt(rb, a0), B = pt(rb, a1), C = pt(ra, a1), D = pt(ra, a0);
    return `M${f(A[0])} ${f(A[1])}A${rb} ${rb} 0 0 1 ${f(B[0])} ${f(B[1])}L${f(C[0])} ${f(C[1])}A${ra} ${ra} 0 0 0 ${f(D[0])} ${f(D[1])}Z`; };
  const total = rows.reduce((s, r) => s + r.n, 0) || 1, mood = rows.reduce((s, r) => s + r.mood * r.n, 0) / total;
  const parts = rows.map((r, i) => {
    const a0 = 2 * Math.PI * i / n + gap, a1 = 2 * Math.PI * (i + 1) / n - gap, mid = (a0 + a1) / 2;
    const ra = r.mood >= 0 ? r0 : r0 - Math.max(2, span * -r.mood), rb = r.mood >= 0 ? r0 + Math.max(2, span * r.mood) : r0;
    const L = pt(93, mid);
    return `<path class="b" d="${wedge(ra, rb, a0, a1)}" fill="${r.mood >= 0 ? "var(--gain)" : "var(--loss)"}" data-gfilter="${esc(r.key)}"><title>${esc(r.label)}: ${r.up} ▲ · ${r.down} ▼ din ${r.n}</title></path>
      <text x="${f(L[0])}" y="${f(L[1] + 2.5)}" text-anchor="middle">${esc(r.label.length > 9 ? r.label.slice(0, 8) + "…" : r.label)}</text>`;
  }).join("");
  return `<svg class="polar" viewBox="0 0 200 200" role="img" aria-label="Sentimentul consiliului pe categorii" style="width:100%;max-width:300px;display:block;margin:6px auto 0">
    <circle cx="${cx}" cy="${cy}" r="${r0}" fill="none" stroke="var(--line-2)" stroke-dasharray="2 3"/>${parts}
    <text class="lab" x="${cx}" y="${cy + 1}" text-anchor="middle" style="font:500 13px var(--font-display);fill:var(--fg)">${mood >= 0 ? "+" : "−"}${Math.round(100 * Math.abs(mood))}</text>
    </svg>`;
}
function sentimentRows() {
  const c = DATA.council; if (!c || !c.exists || !c.markets) return [];
  return GROUPS.map(g => { const it = c.markets.filter(m => (m.group || "alte") === g.key); if (!it.length) return null;
    const up = it.filter(m => m.net > 0).length, down = it.filter(m => m.net < 0).length;
    return {key: g.key, label: g.label, n: it.length, up, down, mood: (up - down) / it.length}; }).filter(Boolean);
}

// radar de limite: cât din fiecare plafon e folosit (marginea exterioară = limita)
function radar(rows) {
  const n = rows.length; if (n < 3) return "";
  const cx = 150, cy = 100, R = 56, pt = (k, r) => { const a = 2 * Math.PI * k / n; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  const poly = rows.map((r, k) => pt(k, R * Math.min(1.05, Math.max(0.04, r.ratio)))).map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
  const ring = f => rows.map((_, k) => pt(k, R * f)).map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
  const labs = rows.map((r, k) => { const q = pt(k, R + 9), sx = Math.sin(2 * Math.PI * k / n); return `<text x="${q[0].toFixed(1)}" y="${(q[1] + 2.5).toFixed(1)}" text-anchor="${sx > 0.3 ? "start" : sx < -0.3 ? "end" : "middle"}">${esc(r.name.length > 22 ? r.name.slice(0, 21) + "…" : r.name)}</text>`; }).join("");
  return `<svg class="radar" viewBox="0 0 300 200" role="img" aria-label="Radar de limite" style="width:100%;max-width:380px;display:block;margin:0 auto">
    <polygon points="${ring(1)}" fill="none" stroke="var(--line-2)" stroke-dasharray="3 3"/><polygon points="${ring(.66)}" fill="none" stroke="var(--line)"/><polygon points="${ring(.33)}" fill="none" stroke="var(--line)"/>
    <polygon points="${poly}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" style="filter:drop-shadow(0 0 5px var(--accent))"/>${labs}</svg>`;
}

// harta categoriilor: suprafața = numărul de piețe, culoarea = sentimentul
function treemap(rows) {
  if (!rows.length) return "";
  const out = [], sorted = rows.slice().sort((a, b) => b.n - a.n);
  (function lay(list, x, y, w, h) {
    if (list.length === 1) { out.push({r: list[0], x, y, w, h}); return; }
    const sum = list.reduce((s, r) => s + r.n, 0); let acc = 0, k = 0;
    while (k < list.length - 1 && acc + list[k].n / 2 < sum / 2) acc += list[k++].n;
    k = Math.max(1, k);
    const a = list.slice(0, k), b = list.slice(k), fa = a.reduce((s, r) => s + r.n, 0) / sum;
    if (w >= h) { lay(a, x, y, w * fa, h); lay(b, x + w * fa, y, w * (1 - fa), h); } else { lay(a, x, y, w, h * fa); lay(b, x, y + h * fa, w, h * (1 - fa)); }
  })(sorted, 0, 0, 100, 100);
  return `<div class="tmap" role="group" aria-label="Harta categoriilor">${out.map(o => `<button type="button" data-gfilter="${esc(o.r.key)}" aria-pressed="${FILTER === o.r.key}" style="left:${o.x.toFixed(2)}%;top:${o.y.toFixed(2)}%;width:${o.w.toFixed(2)}%;height:${o.h.toFixed(2)}%;--c:var(${o.r.mood >= 0 ? "--gain" : "--loss"});--t:${Math.min(1, Math.abs(o.r.mood)).toFixed(2)}">
    <b>${esc(o.r.label)}</b><span>${o.r.n} piețe · ▲${o.r.up} ▼${o.r.down}</span></button>`).join("")}</div>`;
}

// orbita agenților: mărimea = încrederea, culoarea = votul
function orbit(m) {
  const agents = Object.entries(m.votes); if (!agents.length) return "";
  const cx = 100, cy = 92, R = 54, col = v => v === "BUY" ? "var(--gain)" : v === "SELL" ? "var(--loss)" : "var(--muted)";
  const nodes = agents.map(([a, v], k) => { const ang = 2 * Math.PI * k / agents.length - Math.PI / 2, x = cx + R * Math.cos(ang), y = cy + R * Math.sin(ang), c = m.conf && m.conf[a] != null ? m.conf[a] : 0.5, r = 8 + 9 * c;
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col(v)}" stroke-opacity=".45" stroke-dasharray="2 3"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col(v)}" fill-opacity=".22" stroke="${col(v)}" stroke-width="1.6"/>
      <text x="${x.toFixed(1)}" y="${(y + r + 8).toFixed(1)}">${esc(a)}</text>`; }).join("");
  return `<svg class="orbit" viewBox="0 0 200 196" width="280" role="img" aria-label="Orbita agenților">${nodes}<circle class="core" cx="${cx}" cy="${cy}" r="19"/>
    <text class="net" x="${cx}" y="${cy + 4}" style="font:500 13px var(--font-display)">${m.net > 0 ? "+" : ""}${m.net}</text></svg>`;
}

function dailyBars(history) {
  const d = []; for (let i = 1; i < history.length; i++) d.push(history[i].equity - history[i - 1].equity);
  if (d.length < 2) return "";
  const mx = Math.max(...d.map(Math.abs)) || 1;
  return `<div class="bars" aria-hidden="true">${d.slice(-40).map(v => `<span class="${v < 0 ? "n" : ""}" style="height:${Math.max(6, 100 * Math.abs(v) / mx / (v < 0 ? 1 : 1)).toFixed(0)}%"></span>`).join("")}</div>`;
}
function safetyRing(a) {
  const rows = riskRows(a); if (!rows.length) return "";
  const worst = rows.slice().sort((x, y) => y.ratio - x.ratio)[0], free = Math.max(0, 1 - worst.ratio);
  return `<div class="panel"><div class="label">Marja de siguranță</div><div class="safety">${ring(free, Math.round(100 * free) + "%", "LIBER", "Marja de siguranță", 112)}
    <div style="flex:1;min-width:150px"><div class="sub" style="margin:0">Cel mai aproape de limită: <b>${esc(worst.name.toLowerCase())}</b>, la ${Math.round(100 * worst.ratio)}% din plafon.</div></div></div></div>`;
}
// Fereastra „Pozițiile deschise”: în ce e investit, suma investită și câștigul/pierderea fiecărei poziții.
// prețuri mici (memecoin-uri) cu destule zecimale: 0,00001234, nu 0,00
const pxf = v => { const x = Math.abs(v || 0); if (!x) return "0"; if (x >= 100) return money2(v);
  const d = Math.min(10, Math.max(2, 3 - Math.floor(Math.log10(x)))); return new Intl.NumberFormat("ro-RO", {minimumFractionDigits: d, maximumFractionDigits: d}).format(v); };
let POSF = store("bnd-pf-filtru") || "toate", POSS = store("bnd-pf-sort") || "investit";
function portfolioPanel(key, heading) {
  const a = DATA.accounts.find(x => x.key === (key || "unic")); if (!a || !a.exists) return "";
  if (!a.positions.length) return `<div class="panel"><div class="label">${esc(heading || "Pozițiile deschise")}</div><p class="sub">Nicio poziție deschisă: banii stau în numerar.</p></div>`;
  const rows = a.positions.map(p => { const inv = Math.abs(p.quantity * p.avg), today = p.close ? p.quantity * (p.last - p.close) : 0;
    return {p, inv, pnl: p.pnl || 0, pct: inv ? 100 * (p.pnl || 0) / inv : 0, today, side: p.quantity < 0 ? "short" : "long"}; });
  const sum = f => rows.reduce((s, r) => s + f(r), 0);
  const inv = sum(r => r.inv), pnl = sum(r => r.pnl), today = sum(r => r.today), nl = rows.filter(r => r.side === "long").length;
  const shown = rows.filter(r => POSF === "toate" || r.side === POSF)
    .sort(POSS === "castig" ? (x, y) => y.pnl - x.pnl : POSS === "pierdere" ? (x, y) => x.pnl - y.pnl : (x, y) => y.inv - x.inv);
  const mx = Math.max(1, ...rows.map(r => Math.abs(r.pnl)));

  const chip = (attr, v, txt, cur) => `<button class="chip${cur === v ? " on" : ""}" type="button" ${attr}="${v}" aria-pressed="${cur === v}">${txt}</button>`;
  const row = r => `<button class="pf-row" type="button" data-m="${esc(r.p.symbol)}">
      <span><b>${esc(label(r.p.symbol))}</b><span class="pill ${r.side}">${r.side}</span><div class="meta" style="color:var(--muted);font-size:12px">${esc((GROUPS.find(g => g.key === r.p.group) || {}).label || "")}</div></span>
      <span class="n">${fm(r.inv, a)}</span>

      <span class="n ${cls(r.pnl)}">${sg(r.pnl)}${money2(Math.abs(r.pnl))}</span>
      <span class="n ${cls(r.pnl)}">${pct1(r.pct)}</span>
      <span class="pf-bar"><span style="width:${(100 * Math.abs(r.pnl) / mx).toFixed(1)}%;background:${r.pnl >= 0 ? "var(--gain)" : "var(--loss)"}"></span></span></button>`;
  return `<div class="panel" id="pozitii${key && key !== "unic" ? "-" + key : ""}"><div class="label">${esc(heading || "Pozițiile deschise")} · ${rows.length} (${nl} long, ${rows.length - nl} short)${a.live ? " · prețuri de acum" : " · ultima închidere"}</div>
    <div class="pf-head"><div><span class="label">Investit</span><b>${fm(inv, a)}</b></div>
      <div><span class="label">Câștig / pierdere</span><b class="${cls(pnl)}">${sg(pnl)}${money2(Math.abs(pnl))}</b><span class="sub ${cls(pnl)}">${pct(inv ? 100 * pnl / inv : 0)} din investit</span></div>
      <div><span class="label">Azi (față de ultima închidere)</span><b class="${cls(today)}">${sg(today)}${money2(Math.abs(today))}</b></div>
      <div><span class="label">În plus / în minus</span><b><span class="gain">${rows.filter(r => r.pnl > 0).length}</span> / <span class="loss">${rows.filter(r => r.pnl < 0).length}</span></b></div></div>
    <div class="pf-tools">${chip("data-posf", "toate", "Toate", POSF)}${chip("data-posf", "long", "Long", POSF)}${chip("data-posf", "short", "Short", POSF)}
      <span style="flex:1"></span>${chip("data-poss", "investit", "După sumă", POSS)}${chip("data-poss", "castig", "Cele mai bune", POSS)}${chip("data-poss", "pierdere", "Cele mai slabe", POSS)}</div>

// Fila „Reguli vs AI”: contul condus de consiliu (unic) față de contul doar pe reguli (control), pe aceeași fereastră.
const TEST_LAST = "2026-11-30";
function compareView() {
  const ai = DATA.accounts.find(x => x.key === "unic"), ru = DATA.accounts.find(x => x.key === "control");
  if (!ai || !ai.exists) return `<p class="empty">Contul unic nu există încă.</p>`;
  if (!ru || !ru.exists) return `<div class="panel hot"><div class="label">Reguli vs AI</div><p class="sub">Contul „Reguli matematice” (doar reguli) nu are încă date. Apare după prima rulare.</p></div>`;
  const start = ru.history.length ? ru.history[0].t.slice(0, 10) : (DATA.generated || "").slice(0, 10);
  const before = ai.history.filter(h => h.t.slice(0, 10) < start), aiBase = before.length ? before[before.length - 1].equity : ai.initial;
  const nowAi = eq(ai), nowRu = eq(ru), rAi = 100 * (nowAi / aiBase - 1), rRu = 100 * (nowRu / ru.initial - 1), diff = rAi - rRu;
  const day = Math.max(1, Math.floor((Date.parse(DATA.generated) - Date.parse(start + "T00:00:00Z")) / 864e5) + 1);
  const total = Math.round((Date.parse(TEST_LAST + "T00:00:00Z") - Date.parse(start + "T00:00:00Z")) / 864e5) + 1;
  const cost = ((DATA.council || {}).costs || {}).spent;
  const dd = h => { let pk = -Infinity, m = 0; h.forEach(v => { pk = Math.max(pk, v); m = Math.max(m, 1 - v / pk); }); return 100 * m; };
  const t0 = Date.parse(start + "T00:00:00Z"), tNow = Date.parse(DATA.quotes_time || DATA.generated);
  const aiPts = [{t: t0, v: aiBase}, ...ai.history.filter(h => h.t.slice(0, 10) >= start).map(h => ({t: Date.parse(h.t), v: h.equity})), {t: tNow, v: nowAi}];
  const ruPts = [{t: t0, v: ru.initial}, ...ru.history.map(h => ({t: Date.parse(h.t), v: h.equity})), {t: tNow, v: nowRu}];
  const aiSeries = aiPts.map(p => p.v), ruSeries = ruPts.map(p => p.v);
  const pnl = a => a.positions.reduce((s, p) => s + (p.pnl || 0), 0), inv = a => a.positions.reduce((s, p) => s + Math.abs(p.quantity * p.avg), 0);
  const card = (a, title, sub, r, series, accent) => `<div class="panel${accent ? " hot" : ""}"><div class="label">${esc(title)}</div><div class="sub">${esc(sub)}</div>
      <div class="bigval" style="font-size:40px;margin-top:6px">${fm(eq(a), a)}</div>
      <div class="pillrow"><span class="tag ${r >= 0 ? "gain" : "loss"}">${pct(r)} din ${esc(start.slice(8, 10) + "." + start.slice(5, 7))}</span><span class="tag">drawdown ${money2(dd(series))}%</span></div>

  // grafic: ambele conturi în % față de ziua de start a comparației

  const A = toPct(aiPts, aiBase), B = toPct(ruPts, ru.initial), all = A.concat(B).map(p => p.v).concat([0]);
  const lo = Math.min(...all), hi = Math.max(...all), span = (hi - lo) || 1, tEnd = Math.max(tNow, t0 + 864e5);
  const x = t => P + (t - t0) / (tEnd - t0) * (W - 2 * P), y = v => H - P - (v - lo) / span * (H - 2 * P);
  const path = s => s.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");

      </svg><div class="sub" style="display:flex;justify-content:space-between;font-family:var(--font-data);font-size:11.5px"><span>${esc(start)}</span><span>min ${esc(pct1(lo))} · max ${esc(pct1(hi))}</span><span>acum</span></div>`;
  const lead = Math.abs(diff) < 0.005 ? "Deocamdată egalitate." : diff > 0
    ? `<b>Consiliul AI conduce</b> cu ${money2(diff)} puncte procentuale.` : `<b>Regulile matematice conduc</b> cu ${money2(-diff)} puncte procentuale.`;
  return `<div class="panel hot"><div class="label">Reguli matematice față de consiliul AI · ziua ${Math.min(day, total)} din ${total}</div>
      <p style="margin:8px 0 4px;font-size:17px">${lead}</p>
      <p class="sub">Cele două conturi sunt identice (aceleași piețe, limite și capital); singura diferență e consiliul AI. Comparația pornește de la ${esc(start)}, ziua în care a pornit contul doar pe reguli (contul unic avea deja poziții de pe 1.11, iar cel pe reguli pornește de la zero, deci primele zile pot diferi și din acest motiv). Cost AI total până acum: ${cost == null ? "fără date" : money2(cost) + " $"}. Decizia se ia după ${esc(TEST_LAST)}, pe randamentul fiecărui cont.</p>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px" class="sub"><span><span style="display:inline-block;width:18px;height:3px;background:var(--accent);vertical-align:middle"></span> Consiliul AI (contul unic)</span><span><span style="display:inline-block;width:18px;height:0;border-top:3px dashed var(--gain);vertical-align:middle"></span> Reguli matematice</span></div>
      <div style="margin-top:10px">${chart}</div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${card(ai, "Consiliul AI (contul unic)", "50% reguli + 50% consiliu AI", rAi, aiSeries, false)}${card(ru, "Reguli matematice", "doar regulile, fără AI", rRu, ruSeries, false)}</div>
    ${portfolioPanel("control", "Pozițiile deschise · Reguli matematice")}`;
}

  const long = a.positions.filter(p => p.quantity > 0).reduce((s, p) => s + Math.abs(p.value || 0), 0), short = total - long;
  return `<h2>Unde sunt banii</h2><div class="panel"><div class="ringbox" style="align-items:center;flex-wrap:wrap">${donut(rows, total)}
    <div style="flex:1;min-width:180px"><div class="legend" style="margin:0">${rows.map(r => `<span><i style="background:${r.c}"></i>${esc(r.g.label)} <b>${Math.round(100*r.v/total)}%</b></span>`).join("")}</div>
    <div class="label" style="margin-top:14px">Long față de short</div><div class="split" role="img" aria-label="Long ${Math.round(100*long/total)}%, short ${Math.round(100*short/total)}%"><span class="l" style="width:${(100*long/total).toFixed(1)}%"></span><span class="s" style="width:${(100*short/total).toFixed(1)}%"></span></div>
    <div class="sub">long ${Math.round(100*long/total)}% · short ${Math.round(100*short/total)}%</div></div></div></div>`;
}
const euro = (v, acc) => CUR ? "" : (DATA.fx && acc.currency === "USD" ? `<div class="sub">≈ ${money(v / DATA.fx.eurusd, "€")}${DATA.fx.usdron ? " · " + money(v * DATA.fx.usdron, "lei") : ""}</div>` : "");

function account(a) {
  if (!a.exists) return `<p class="empty">Contul „${esc(a.title)}” nu există încă.</p>`;
  const value = eq(a), ch = 100 * (value / a.initial - 1), cls = ch >= 0 ? "gain" : "loss";
  const notice = a.kill_switch ? `<div class="notice"><b>Oprire de siguranță activă.</b> ${esc(a.kill_reason || "")}</div>` : "";
  const maxPnl = Math.max(1, ...a.positions.map(p => Math.abs(p.pnl || 0)));
  const posRow = p => {
    const side = p.quantity < 0 ? "short" : "long";
    return `<button class="row" type="button" data-m="${esc(p.symbol)}"><div><span class="name">${star(p)}${esc(label(p.symbol))}</span><span class="pill ${side}">${side}</span>
      <div class="meta">intrare ${money2(p.avg)} · acum ${money2(p.last)}${p.stop ? " · stop " + money2(p.stop) : ""}</div></div>
      <div class="num">${money(p.value, "")}<div class="${p.pnl >= 0 ? "gain" : "loss"}">${p.pnl >= 0 ? "+" : ""}${money2(p.pnl)}</div></div>
      <div class="pbar"><span style="width:${(100 * Math.abs(p.pnl || 0) / maxPnl).toFixed(1)}%;background:${p.pnl >= 0 ? "var(--gain)" : "var(--loss)"}"></span></div></button>`;
  };
  const pos = a.positions.length ? (byGroup(a.positions).map(g => groupHead(g, tally(g.items, p => p.quantity)) + g.items.map(posRow).join("")).join("") || noMatch())
    : `<p class="empty">Nicio poziție deschisă: banii stau în numerar.</p>`;
  const ordRow = o => `<button class="row" type="button" data-m="${esc(o.symbol)}"><div><span class="name">${esc(label(o.symbol))}</span><span class="pill ${o.kind==="short"?"short":""}">${o.kind === "închide" ? "închide poziția" : o.kind === "short" ? "vinde (short)" : "cumpără (long)"}</span>
      <div class="meta">se execută la deschiderea următoare</div></div><div class="num">${money2(o.quantity)}</div></button>`;
  const ord = a.orders.length ? (byGroup(a.orders).map(g => groupHead(g, tally(g.items, o => o.kind === "închide" ? 0 : o.side === "BUY" ? 1 : -1)) + g.items.map(ordRow).join("")).join("") || noMatch())
    : `<p class="empty">Nicio comandă în așteptare.</p>`;
  const maxLev = (a.rules && a.rules.max_leverage) || 0;
  const levRing = a.leverage != null && maxLev ? `<div class="ringbox">${ring(a.leverage / maxLev, money2(a.leverage) + "x", "din " + money2(maxLev) + "x", "Leverage folosit", 92)}<div><div class="label">Leverage${help("leverage")}</div><div class="sub">cât din plafonul permis e folosit acum</div></div></div>` : "";
  const dd = a.drawdown_pct || 0;
  return `${notice}<div class="grid"><div class="panel hot"><div class="label">${esc(a.title)} · ${esc(CUR || a.currency)}${a.live ? '<span class="tag" style="margin-left:8px;padding:1px 8px">preț de acum</span>' : '<span class="tag" style="margin-left:8px;padding:1px 8px;color:var(--muted)">ultima închidere</span>'}</div>
    <div class="hero-value" data-cu>${hero(value, a)}</div>${euro(value, a)}
    <div class="pillrow"><span class="tag ${cls}">${pct(ch)}</span><span class="tag">start ${fm(a.initial, a)}</span></div>
    <div class="sub" style="margin-top:12px">${esc(a.subtitle)}</div>${rulesLine(a)}${spark(a.history, a.initial, a.key, false, a.live ? {v: a.live_equity, t: DATA.quotes_time || DATA.generated} : null)}</div>
    <div class="panel">${levRing}<div class="stats" style="margin-bottom:0"><div><span class="label">Numerar</span><b>${fm(a.cash, a)}</b></div>
    <div><span class="label">Poziții</span><b>${a.positions.length}</b></div><div><span class="label">Tranzacții</span><b>${a.fills}</b></div>
    <div><span class="label">Drawdown${help("drawdown")}</span><b class="${dd ? "loss" : ""}">${dd ? "−" + money2(dd) + "%" : "0,00%"}</b></div>
    <div><span class="label">Costuri plătite</span><b>${money2(a.costs_total)}</b></div></div></div></div>
    ${riskPanel(a)}${allocation(a)}<h2>Poziții</h2>${pos}<h2>Comenzi pentru mâine</h2>${ordersPreview(a)}${ord}${a.key === "unic" ? stressPanel(a) : ""}${exposureBlock(a.exposure)}`;
}

function exposureBlock(x) {
  if (!x) return "";
  const part = (title, r) => {
    if (!r || !r.positions) return `<p class="sub">${title}: nicio poziție.</p>`;
    if (r.note) return `<p class="sub">${title}: ${esc(r.note)}</p>`;
    const rows = r.clusters.filter(c => c.members.length > 1).map(c => `<tr><td>${c.members.map(esc).join(", ")}</td><td>${Math.round(100 * c.gross)}%</td><td>${c.risk_share == null ? "–" : Math.round(100 * c.risk_share) + "%"}</td></tr>`).join("");
    return `<p class="sub">${title}: ${r.positions} poziții, expunere brută ${Math.round(100 * r.gross)}%, volatilitate zilnică ~${r.portfolio_vol_daily_pct == null ? "–" : r.portfolio_vol_daily_pct.toFixed(2) + "%"}. ${r.warnings.length ? "" : "Niciun grup corelat peste prag."}${r.missing_data && r.missing_data.length ? " Fără istoric de preț pentru " + r.missing_data.length + " piețe (neincluse)." : ""}</p>
      ${r.warnings.map(w => `<p class="loss">${esc(w)}</p>`).join("")}
      ${rows ? `<div class="scroll"><table><tr><th>Grup care se mișcă împreună</th><th>Din capital</th><th>Din risc</th></tr>${rows}</table></div>` : ""}`;
  };
  return `<h2>Expuneri corelate</h2><div class="panel">${part("Acum", x.current)}${part("Planificat", x.planned)}<p class="sub">Doar informare: nu schimbă nicio poziție.</p></div>`;
}

function testCard() {
  const t = DATA.test; if (!t) return "";
  const day = iso => Date.UTC(+iso.slice(0,4), +iso.slice(5,7) - 1, +iso.slice(8,10));
  const today = day(DATA.generated.slice(0,10)), total = Math.round((day(t.end) - day(t.start)) / 864e5);
  const done = Math.min(total, Math.max(0, Math.round((today - day(t.start)) / 864e5)));
  const left = Math.max(0, total - done), finished = done >= total;
  const f = iso => iso.slice(8,10) + "." + iso.slice(5,7);
  const ticks = Array.from({length: total + 1}, (_, i) => `<span class="${i < done ? "on" : i === done ? "now" : ""}"></span>`).join("");
  const miles = (t.milestones || []).map(m => `<span>${f(m.date)} ${esc(m.label)}</span>`).join("");
  return `<div class="panel"><div class="ringbox">${ring(done / total, finished ? "gata" : done + "/" + total, "ZILE", "Progresul testului", 112)}
    <div><div class="label">Testul de ${total} zile</div><div style="font:500 20px var(--font-display);margin-top:6px">${finished ? "Încheiat" : "Ziua " + done + " din " + total}</div>
    <div class="sub">${finished ? "Raportul final: " + f(t.report) : "mai sunt " + left + (left === 1 ? " zi" : " zile") + " până pe " + f(t.end) + ", raportul pe " + f(t.report)}</div></div></div>
    <div class="tl" style="--n:${total + 1}" aria-hidden="true">${ticks}</div><div class="miles">${miles}</div>
    <p class="sub">Regulile și limitele de risc nu se schimbă pe durata testului.</p></div>`;
}

function systemPanel() {
  const rows = (DATA.system || []).map(r => {
    const ok = r.conclusion === "success";
    return `<div><span>${esc(r.name)}</span><span class="${ok ? "gain" : r.conclusion === "în curs" ? "" : "loss"}">${ok ? "ok" : esc(r.conclusion)} <small>${r.time ? when(r.time) : ""}</small></span></div>`;
  }).join("");
  return rows ? `<div class="panel"><div class="label">Stare sistem · ultima rulare programată</div><div class="sys">${rows}</div></div>` : "";
}

function feedPanel() {
  const items = (DATA.alerts || []).map(t => ({t, bad: true})).concat((DATA.events || []).map(t => ({t, bad: false})));
  if (!items.length) return "";
  return `<div class="panel"><div class="label">Activitate</div><div class="feed">${items.map(x => `<div><i class="${x.bad ? "bad" : ""}"></i><span>${esc(x.t)}</span></div>`).join("")}</div></div>`;
}

function favoritesPanel() {
  const known = universe();
  const favs = FAV.filter(s => known.some(u => u.symbol === s));
  if (!favs.length) return `<div class="panel"><div class="label">Favorite</div><p class="sub">Deschide o piață și apasă „Adaugă la favorite”: apare aici cu semnalul consiliului și poziția ta.</p></div>`;
  return `<div class="panel"><div class="label">Favorite</div>${favs.map(s => { const m = councilMarket(s), h = holdings(s).find(x => x.p);
    return `<button class="mover" type="button" data-m="${esc(s)}"><span><b>${esc(label(s))}</b> <span class="sub">${h ? (h.p.quantity < 0 ? "short" : "long") + " · " + money2(h.p.pnl) : "fără poziție"}</span></span><span class="mono ${m && m.net > 0 ? "gain" : m && m.net < 0 ? "loss" : ""}">${m ? (m.net > 0 ? "▲" : m.net < 0 ? "▼" : "–") + (m.net ? Math.abs(m.net) : "") : "–"}</span></button>`; }).join("")}</div>`;
}

function councilSnapshot() {
  const c = DATA.council; if (!c || !c.exists || !c.day) return `<div class="panel"><div class="label">Consiliul AI</div><p class="empty">Consiliul nu a votat încă.</p></div>`;
  const ms = c.markets || [], up = ms.filter(m => m.net > 0).length, down = ms.filter(m => m.net < 0).length;
  const split = ms.filter(m => Object.values(m.votes).includes("BUY") && Object.values(m.votes).includes("SELL")).length;
  const cost = c.costs ? `<div class="stats" style="margin-bottom:0"><div><span class="label">Azi</span><b>${money2(c.costs.today)} $</b></div>
    <div><span class="label">Rămas din cheie</span><b>${money2(c.costs.remaining)} $</b></div>
    <div><span class="label">Ritm</span><b>${c.costs.today > 0 ? "≈ " + Math.floor(c.costs.remaining / c.costs.today) + " zile" : "–"}</b></div></div>` : "";
  return `<button class="panel" type="button" data-go="consiliu" style="width:100%;text-align:left;display:block"><div class="label">Consiliul AI · ${esc(c.day)}</div>
    <div class="pillrow"><span class="tag gain">▲ ${up}</span><span class="tag loss">▼ ${down}</span><span class="tag">– ${ms.length - up - down}</span><span class="tag" style="color:var(--warn)">dezacord ${split}</span></div>
    <div class="strip" aria-hidden="true">${ms.map(m => `<i class="${m.net > 0 ? "up" : m.net < 0 ? "down" : ""}"></i>`).join("")}</div>
    <div style="margin-top:14px">${cost}</div></button>`;
}

function summary() {
  const hasBridge = !!bridge();
  const cards = DATA.accounts.filter(a => !a.archived && !(hasBridge && a.key === "unic")).map(a => {
    if (!a.exists) return `<div class="panel hot"><div class="label">${esc(a.title)}</div><div class="sub">Nu există încă.</div></div>`;
    const v = eq(a), ch = 100 * (v / a.initial - 1);
    return `<button class="panel hot" type="button" data-go="unic" style="width:100%;text-align:left;display:block"><div class="label">${esc(a.title)}${a.kill_switch ? ' · <span class="loss">oprit</span>' : ""}</div>
      <div class="hero-value" data-cu>${hero(v, a)}</div>${euro(v, a)}
      <div class="pillrow"><span class="tag ${ch >= 0 ? "gain" : "loss"}">${pct(ch)}</span><span class="tag">${a.positions.length} poziții</span><span class="tag">${a.orders.length} comenzi</span></div>${spark(a.history, a.initial, "s" + a.key, false, a.live ? {v: a.live_equity, t: DATA.quotes_time || DATA.generated} : null)}</button>`;
  }).join("");
  const rate = DATA.fx ? `<p class="sub">Curs EUR/USD: <b>${DATA.fx.eurusd.toFixed(4)}</b> (1 € = ${DATA.fx.eurusd.toFixed(2)} $)${DATA.fx.eurron ? " · EUR/RON: <b>" + DATA.fx.eurron.toFixed(4) + "</b>" : ""}, la ${when(DATA.fx.time)}.</p>` : "";
  const cm = DATA.council && DATA.council.exists ? DATA.council.markets || [] : [];
  const cats = cm.length ? `<h2>Semnale pe categorii</h2><div class="panel"><div class="scroll"><table><tr><th>Categorie</th><th>Piețe</th><th>▲</th><th>▼</th><th>–</th></tr>${byGroup(cm).map(g => {
    const up = g.items.filter(m => m.net > 0).length, down = g.items.filter(m => m.net < 0).length;
    return `<tr><td>${esc(g.label)}</td><td>${g.items.length}</td><td class="gain">${up}</td><td class="loss">${down}</td><td>${g.items.length - up - down}</td></tr>`;
  }).join("")}</table></div></div>` : "";
  const old = DATA.accounts.filter(a => a.archived && a.exists).length;
  return `${bridge()}${portfolioPanel()}${briefing()}<div class="grid">${cards}${testCard()}</div><div class="actions"><button class="btn" type="button" data-copy>Copiază rezumatul</button><button class="btn" type="button" data-pal>Caută o piață</button><button class="btn" type="button" data-gloss>Glosar</button></div>
    <div class="grid" style="margin-top:12px">${councilSnapshot()}${favoritesPanel()}${feedPanel()}${systemPanel()}</div>${cats}${rate}
    <p class="sub">Din 1 noiembrie există un singur cont activ; cele ${old} conturi vechi sunt oprite și păstrate în fila Arhivă.</p>`;
}

function comparison(c) {
  const cmp = c.comparison;
  if (!cmp || !cmp.settled_decisions) return `<h2>Cine a ghicit mai des</h2><p class="empty">Nicio decizie încheiată încă: prima se închide după 5 zile.</p>`;
  const line = (label, r) => `<tr><td>${label}</td><td>${r.calls}</td><td>${r.hit_rate == null ? "–" : Math.round(100 * r.hit_rate) + "%"}</td><td>${r.mean_return_pct == null ? "–" : pct(r.mean_return_pct)}</td></tr>`;
  const ag = Object.entries(c.agents).map(([n, a]) => `<tr><td>${esc(n)}</td><td>${a.calls}</td><td>${a.hit_rate == null ? "–" : Math.round(100 * a.hit_rate) + "%"}</td><td>${a.mean_brier == null ? "–" : a.mean_brier.toFixed(2)}</td></tr>`).join("");
  return `<h2>Cine a ghicit mai des</h2><div class="panel"><div class="scroll"><table><tr><th></th><th>Apeluri</th><th>Bine</th><th>Medie</th></tr>
    ${line("Consiliul (majoritate)", cmp.council)}${line("Înclinația consiliului", cmp.lean)}${line("Botul pe reguli", cmp.bot)}${line("Doar cumpără", cmp.always_long)}</table></div>
    <p class="sub">${cmp.settled_decisions} decizii încheiate. Cu puține decizii, diferențele pot fi noroc.</p></div>
    <h2>Pe agenți</h2><div class="panel"><div class="scroll"><table><tr><th>Agent</th><th>Păreri</th><th>Bine</th><th>Brier</th></tr>${ag}</table></div></div>${analysisNote(c.analysis)}`;
}
function analysisNote(a) {
  if (!a || !a.oos) return "";
  const over = Object.entries(a.overconfidence || {}).map(([n, v]) => `${esc(n)} ${v > 0 ? "+" : ""}${Math.round(100 * v)}%`).join(", ");
  const al = a.alpha && a.alpha.alpha_next && a.alpha.alpha_next.calls
    ? ` Față de piață (alpha, intrare după decizie): ${Math.round(100 * a.alpha.alpha_next.hit_rate)}% bine din ${a.alpha.alpha_next.calls} decizii, față de ${Math.round(100 * a.alpha.raw.hit_rate)}% brut.` : "";
  return `<p class="sub">Supraîncredere (încrederea declarată minus rata reală): ${over || "–"}. ${a.note ? esc(a.note) : ""}${al}
    ${a.oos.evaluated ? "Ponderarea pe zile nevăzute: " + esc(a.oos.verdict) + "." : esc(a.oos.note || "")}</p>`;
}
function agentsPanel(c) {
  const rows = Object.entries(c.models || {}).map(([name, m]) => {
    const r = ((c.last_round || {}).agents || {})[name];
    const state = !r ? "–" : r.failed ? `<span class="loss">${r.failed} eșecuri</span>` : `<span class="gain">ok</span>`;
    const lat = r && r.mean_latency_s != null ? r.mean_latency_s.toFixed(1) + " s" : "–";
    return `<tr><td>${esc(name)}</td><td>${state}</td><td>${lat}</td><td>${money2(m.total_cost_usd)}</td></tr>`;
  }).join("");
  return rows ? `<h2>Cei cinci agenți</h2><div class="panel"><div class="scroll"><table><tr><th>Agent</th><th>Ultima rundă</th><th>Latență</th><th>Cost $</th></tr>${rows}</table></div></div>` : "";
}
function agreement(ms) {
  const agents = ms.length ? Object.keys(ms[0].votes) : [];
  if (agents.length < 2) return "";
  const pair = (a, b) => { let both = 0, same = 0; for (const m of ms) { const x = m.votes[a], y = m.votes[b]; if (x && y) { both++; if (x === y) same++; } } return both ? same / both : null; };
  const mean = a => { const v = agents.filter(b => b !== a).map(b => pair(a, b)).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const rows = agents.map(a => `<div><b>${esc(a)}</b>${agents.map(b => { const p = a === b ? 1 : pair(a, b); return `<span style="--p:${p == null ? 0 : p}" title="${esc(a)} și ${esc(b)} votează la fel în ${p == null ? "–" : Math.round(100 * p)}% din piețe">${a === b ? "–" : p == null ? "–" : Math.round(100 * p)}</span>`; }).join("")}</div>`).join("");
  const means = agents.map(a => ({a, v: mean(a)})).filter(x => x.v != null).sort((x, y) => x.v - y.v);
  const odd = means.length ? `<p class="sub">Cel mai des în dezacord cu ceilalți: <b>${esc(means[0].a)}</b> (${Math.round(100 * means[0].v)}% acord mediu). Cel mai aliniat: <b>${esc(means[means.length - 1].a)}</b> (${Math.round(100 * means[means.length - 1].v)}%).</p>` : "";
  return `<h2>Cât de des cad de acord agenții</h2><div class="panel"><div class="matrix" style="--n:${agents.length}"><div class="h"><b></b>${agents.map(a => `<span>${esc(a)}</span>`).join("")}</div>${rows}</div>${odd}</div>`;
}

// „Cumpără/Vinde/Neutru” după înclinația netă (aceeași ca ▲/▼ din bara de semnale); „Dezacord” = cineva a votat BUY și altcineva SELL.
const CONS_FILTERS = [["","Toate"],["BUY","▲ Cumpără"],["SELL","▼ Vinde"],["split","Dezacord"],["HOLD","Neutru"]];
const consMatch = m => !CONS || (CONS === "split" ? Object.values(m.votes).includes("BUY") && Object.values(m.votes).includes("SELL")
  : CONS === "BUY" ? m.net > 0 : CONS === "SELL" ? m.net < 0 : m.net === 0);
function council(c) {
  if (!c.exists || !c.day) return `<p class="empty">Consiliul nu a votat încă.</p>`;
  const marketRow = m => {
    const votes = Object.entries(m.votes).map(([a,v]) => `<span class="v ${esc(v)}">${esc(a)} ${esc(v)}</span>`).join("");
    const bar = Object.values(m.votes).map(v => `<span class="${esc(v)}"></span>`).join("");
    return `<button class="row" type="button" data-m="${esc(m.symbol)}" style="grid-template-columns:1fr"><div><span class="name">${star(m)}${esc(m.symbol)}</span>
      <span class="pill ${m.decision==="SELL"?"short":""}">${m.decision==="HOLD"?"nu tranzacționa":m.decision==="BUY"?"cumpără":"vinde"}</span>
      <div class="vbar" aria-hidden="true">${bar}</div><div class="votes">${votes}</div></div></button>`;
  };
  const tile = m => `<button class="tile ${m.net > 0 ? "up" : m.net < 0 ? "down" : ""}${favCls(m)}" type="button" data-m="${esc(m.symbol)}" style="--t:${Math.min(1, Math.abs(m.net) / 5)}" title="${esc(m.symbol)}: ${m.net > 0 ? "+" : ""}${m.net} net"><b>${esc(label(m.symbol))}</b><span>${m.net > 0 ? "+" : ""}${m.net}</span></button>`;
  const shown = c.markets.filter(consMatch);
  const groups = byGroup(shown);
  const body = !groups.length ? (noMatch() || `<p class="empty">Nicio piață în această categorie de voturi.</p>`)
    : CVIEW === "harta" ? groups.map(g => groupHead(g, tally(g.items, m => m.net)) + `<div class="heat">${g.items.map(tile).join("")}</div>`).join("")
    : groups.map(g => groupHead(g, tally(g.items, m => m.net)) + g.items.map(marketRow).join("")).join("");
  const seg = `<div class="seg" role="group" aria-label="Filtrează după vot">${CONS_FILTERS.map(([k, t]) => `<button type="button" data-cons="${k}" aria-pressed="${CONS === k}">${t}</button>`).join("")}</div>`;
  const vseg = `<div class="seg" role="group" aria-label="Mod de afișare"><button type="button" data-cview="harta" aria-pressed="${CVIEW === "harta"}">Hartă</button><button type="button" data-cview="lista" aria-pressed="${CVIEW === "lista"}">Listă</button></div>`;
  return `<div class="grid"><div class="panel hot"><div class="label">Consiliul AI · ${esc(c.day)}</div>
